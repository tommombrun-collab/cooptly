<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem("_theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooptants · Sec-gé Cooptly</title>
  <!-- Connexions ouvertes d'avance : sans elles, chaque serveur (polices,
       SDK, base de données) coûtait sa propre poignée de main réseau au
       moment où la page en avait besoin. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Le SDK est préchargé dès l'en-tête. Sinon le navigateur ne le
       découvre qu'en arrivant au script, tout en bas de la page. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" />
  <!-- modules du site préchargés (scripts/precharger-modules.mjs) -->
  <link rel="modulepreload" href="/js/absences.js" />
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/capacite.js" />
  <link rel="modulepreload" href="/js/corbeille.js" />
  <link rel="modulepreload" href="/js/delib.js" />
  <link rel="modulepreload" href="/js/fiche-cooptant.js" />
  <link rel="modulepreload" href="/js/firebase-config.js" />
  <link rel="modulepreload" href="/js/icones.js" />
  <link rel="modulepreload" href="/js/nav.js" />
  <link rel="modulepreload" href="/js/notes.js" />
  <link rel="modulepreload" href="/js/org-lookup.js" />
  <link rel="modulepreload" href="/js/recherche.js" />
  <link rel="modulepreload" href="/js/score.js" />
  <link rel="modulepreload" href="/js/tuto.js" />
  <link rel="modulepreload" href="/js/utils.js" />
  <link rel="modulepreload" href="/js/vote-bureau.js" />
  <link rel="modulepreload" href="/js/vote.js" />
  <!-- /modules -->
  <!-- Polices en <link> et non plus en @import dans main.css : l'@import
       obligeait à télécharger la feuille de style avant même de découvrir
       les polices, trois allers-retours à la suite avant le texte. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    /* ── Tableau des cooptants ───────────────────────────────────── */
    .filtres { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
    .filtres-sep { width:1px; height:20px; background:var(--border); margin:0 2px; }
    .filtre { all:unset; cursor:pointer; padding:5px 11px; border-radius:999px; border:1px solid var(--border);
      font-size:12.5px; font-weight:600; color:var(--text-muted); background:var(--surface); }
    .filtre:hover { border-color:var(--indigo); color:var(--text); }
    .filtre[aria-pressed="true"] { background:var(--indigo-light); border-color:var(--indigo); color:var(--indigo-dark); }
    .filtre:focus-visible { outline:2px solid var(--indigo); outline-offset:2px; }
    .th-tri { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:4px;
      font:inherit; letter-spacing:inherit; text-transform:inherit; color:inherit; }
    .th-tri:hover { color:var(--text); }
    .th-tri:focus-visible { outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px; }
    .tri-fleche { display:inline-block; width:10px; font-size:10px; opacity:.35; }
    .tri-fleche::after { content:'↕'; }
    th[aria-sort="ascending"] .tri-fleche, th[aria-sort="descending"] .tri-fleche { opacity:1; color:var(--indigo); }
    th[aria-sort="ascending"] .tri-fleche::after { content:'▲'; }
    th[aria-sort="descending"] .tri-fleche::after { content:'▼'; }
    .cands-table tbody td { padding:9px 14px; font-size:13.5px; }
    .cands-table thead th { padding:9px 14px; }
    .cands-table tbody tr { cursor:pointer; }
    .cands-table tbody tr:focus-visible { outline:2px solid var(--indigo); outline-offset:-2px; }
    .ct-nom { font-weight:600; white-space:nowrap; }
    .ct-sous { font-size:12px; color:var(--text-light); }
    .ct-rdv { white-space:nowrap; color:var(--text-muted); font-variant-numeric:tabular-nums; }
    .ct-parcours { display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px; }
    .ct-parcours i { width:7px;height:7px;border-radius:2px;display:inline-block; }
    .ct-jury { color:var(--text-muted); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .ct-score { font-family:var(--font-mono); font-weight:700; font-variant-numeric:tabular-nums; }
    .ct-evals { font-variant-numeric:tabular-nums; color:var(--text-muted); white-space:nowrap; }
    .ct-vide { color:var(--text-light); }
    .ct-manque { color:var(--red); font-weight:700; font-size:15px; }
    .ct-absent { color:var(--red); font-weight:600; font-size:12.5px; }
    .cands-table .col-messenger { text-align:center; }
    .case-messenger { width:18px; height:18px; cursor:pointer; accent-color:var(--indigo); }
    .th-mini { display:block; margin:2px auto 0; border:0; background:none; padding:0; font:inherit; font-size:10.5px; font-weight:600; text-transform:none; letter-spacing:0; color:var(--indigo-dark); cursor:pointer; }
    .th-mini:hover { text-decoration:underline; }
    .ct-lien { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:6px; border:1px solid var(--border); color:var(--text-muted); }
    .ct-lien:hover { border-color:var(--indigo); color:var(--indigo-dark); }
    .ct-lien svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; }
    .nb-absences { color:var(--red); font-size:11.5px; font-weight:600; margin-left:6px; white-space:nowrap; }
    @media (max-width: 760px) {
      .cands-table .col-jury, .cands-table .ct-jury, .cands-table .col-eval, .cands-table .ct-evals,
      .cands-table .col-note, .cands-table .col-inscr, .cands-table .col-lien, .cands-table .col-parcours { display:none; }
      .cands-table tbody td, .cands-table thead th { padding:9px 10px; }
    }

    /* ── Lignes du classement : compactes, pour en voir une vingtaine ── */
    #ranking-list { gap:4px !important; }
    .rank-row {
      display:flex;align-items:center;gap:10px;min-height:40px;
      padding:4px 12px;background:var(--surface);border:1px solid var(--border);
      border-radius:10px;position:relative;
    }
    .rank-row:hover { border-color:var(--indigo-mid); }
    .rank-row:focus { outline:none; }
    .rank-row.selection { border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-light); }
    .rank-row.above-cut { border-left:3px solid var(--green); }
    .rank-row.below-cut { opacity:.72; }
    .rank-row.dragging { opacity:.4; }
    .rank-row.drop-above { box-shadow:inset 0 3px 0 var(--indigo); }
    .rank-row.drop-below { box-shadow:inset 0 -3px 0 var(--indigo); }
    .rank-grip {
      flex-shrink:0;width:14px;color:var(--text-light);font-size:12px;line-height:1;
      cursor:grab;user-select:none;text-align:center;
    }
    .rank-grip:active { cursor:grabbing; }
    .rank-nom { flex:1;min-width:0;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      cursor:pointer;background:none;border:none;padding:0;font-family:inherit;color:var(--text);text-align:left; }
    .rank-nom:hover { color:var(--indigo-dark);text-decoration:underline; }
    /* Nom + une ligne d'infos pour classer (parcours, entretien) */
    .rank-ident { flex:1;min-width:0;display:flex;flex-direction:column;gap:1px; }
    .rank-ident .rank-nom { flex:none;max-width:100%; }
    .rank-infos { display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--text-muted);line-height:1.35; }
    .rank-infos span { display:inline-flex;align-items:center;gap:5px;white-space:nowrap; }
    .rank-infos i { width:7px;height:7px;border-radius:2px;display:inline-block; }
    .rank-infos .ri-alerte { color:var(--orange);font-weight:600; }
    .rank-infos .ri-absent { color:var(--red);font-weight:600; }
    body.delib-on .rank-infos { font-size:12.5px; }
    .rank-nom:focus-visible { outline:2px solid var(--indigo);outline-offset:2px;border-radius:4px; }
    .rank-barres { display:flex;gap:4px;align-items:center;flex-shrink:0; }
    .rank-barre { width:30px;height:6px;border-radius:99px;background:var(--bg);overflow:hidden; }
    .rank-barre > div { height:100%;border-radius:99px; }
    .rank-score { font-family:var(--font-mono);font-weight:700;font-size:13.5px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0; }
    .rank-ajust { display:flex; align-items:center; gap:2px; flex-shrink:0; }
    .rank-ajust button { width:24px; height:24px; border:1px solid var(--border); background:var(--surface); border-radius:5px; cursor:pointer; color:var(--text-muted); font-size:14px; line-height:1; padding:0; }
    .rank-ajust button:hover { border-color:var(--indigo); color:var(--indigo-dark); }
    .rank-ajust span { min-width:30px; text-align:center; font-size:12px; font-weight:600; color:var(--text-light); font-variant-numeric:tabular-nums; }
    .rank-ajust.actif span { color:var(--indigo-dark); }
    .rank-row:not(:hover):not(.selection):not(:focus-within) .rank-ajust:not(.actif) { visibility:hidden; }
    body.delib-on .rank-ajust { visibility:visible !important; }
    body.delib-on .rank-ajust button { width:30px; height:30px; font-size:16px; }
    .rank-score.ajuste { text-decoration:underline dotted; text-underline-offset:4px; }
    .ct-ajust { font-size:11.5px; font-weight:600; color:var(--indigo-dark); }
    .rank-evals { font-size:12px;color:var(--text-muted);min-width:34px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums; }
    .rank-aide { font-size:12px;color:var(--text-muted); }
    @media (max-width: 640px) { .rank-barres { display:none; } }

    /* ── Mode délibération (plein écran de réunion) ─────────────── */
    #delib-bar { display:none; }
    /* Profil du classement : visible dans l'onglet Classement comme en délibération */
    .delib-profil:empty { display:none; }
    .delib-profil { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 16px; margin:0 0 12px; }
    .delib-profil .dp-chiffres { display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--text-muted);margin-bottom:10px; }
    .delib-profil .dp-chiffres b { color:var(--text);font-family:var(--font-mono);font-variant-numeric:tabular-nums; }
    body.delib-on .delib-profil { margin-top:-6px; }
    body.delib-on .delib-profil .dp-chiffres { display:none; }
    body.delib-on #delib-bar {
      display:flex;align-items:center;gap:20px;
      padding:16px 22px;margin-bottom:16px;
      /* --indigo-dark et non --indigo : ce bandeau est lu à distance en réunion,
         et le blanc sur --indigo ne donne que 3.4:1 (sous le seuil AA). */
      background:var(--indigo-dark);color:#fff;border-radius:14px;
    }
    #delib-title { font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2; }
    #delib-sub   { font-size:12.5px;opacity:.92;margin-top:2px; }
    #delib-counts { margin-left:auto;display:flex;gap:22px;font-family:var(--font-mono);text-align:center; }
    .delib-count-val { font-size:24px;font-weight:700;line-height:1.1; }
    /* Hiérarchie par la taille et l'espacement, pas par un contraste faible. */
    .delib-count-lbl { font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.92; }
    body.delib-on #delib-bar .btn { background:rgba(255,255,255,.16);color:#fff;border-color:transparent; }

    /* En délibération on masque tout le chrome : seul le classement compte. */
    body.delib-on .nav,
    body.delib-on #candidats-head,
    body.delib-on #candidats-controls,
    body.delib-on #list-view,
    body.delib-on #btn-delib { display:none !important; }
    body.delib-on .page { max-width:1100px;padding-top:18px; }
    /* Lisible à distance : lignes plus hautes, texte plus gros. */
    body.delib-on .rank-row   { min-height:48px;padding:6px 16px;gap:14px; }
    body.delib-on .rank-nom   { font-size:16.5px; }
    body.delib-on .rank-score { font-size:16px; }
    body.delib-on .rank-barre { width:40px;height:8px; }
    body.delib-on .cutoff-divider { font-size:14px;padding:10px 0; }

    /* Champ de position : garde l'allure du badge, mais editable. */
    .rank-num-input {
      flex-shrink:0;width:34px;height:28px;padding:0;text-align:center;
      border:1.5px solid var(--border);border-radius:7px;
      font-family:inherit;font-size:12px;font-weight:800;
      background:var(--bg);color:var(--text-muted);
      cursor:text;transition:border-color .12s,background .12s,color .12s;
      -moz-appearance:textfield;
    }
    .rank-num-input.top { background:var(--indigo);color:#fff;border-color:var(--indigo); }
    .rank-num-input:hover { border-color:var(--indigo-mid); }
    .rank-num-input:focus {
      outline:none;border-color:var(--indigo);
      background:var(--surface);color:var(--text);
      box-shadow:0 0 0 3px var(--indigo-light);
    }
    /* En délibération le champ doit rester cliquable de loin. */
    body.delib-on .rank-num-input { width:44px;height:36px;font-size:15px; }
    /* Sur mobile le glisser-déposer HTML5 ne marche pas : la saisie du rang est
       le seul moyen de réordonner, elle doit donc être confortable au doigt. */
    @media (max-width: 640px) {
      .rank-num-input { width:42px;height:38px;font-size:14px; }
      .rank-grip { display:none; }
    }

    .rank-actions { display:flex;flex-direction:column;gap:5px;flex-shrink:0; }
    .rank-move-btn {
      width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border);
      background:var(--bg);cursor:pointer;font-size:11px;
      display:flex;align-items:center;justify-content:center;
      transition:all .12s;color:var(--text-muted);
    }
    .rank-move-btn:hover:not(:disabled) { border-color:var(--indigo);color:var(--indigo);background:var(--indigo-light); }
    .rank-move-btn:disabled { opacity:.35;cursor:default; }

    /* ── Cutoff divider ──────────────────────────────────────────── */
    .cutoff-divider {
      display:flex;align-items:center;gap:10px;
      margin:8px 0;font-size:12px;font-weight:700;
      color:var(--green);letter-spacing:.02em;
    }
    .cutoff-divider::before,.cutoff-divider::after {
      content:'';flex:1;height:2px;border-radius:1px;background:var(--green);
    }

    /* ── Zone grise : les rangs à discuter autour de la ligne (js/delib.js) ── */
    .rank-row.zone-grise { background:var(--orange-light); border-color:var(--orange-mid); opacity:1; }
    .rank-row.zone-grise:hover { border-color:var(--orange); }
    .zg-divider {
      display:flex;align-items:center;gap:10px;margin:8px 0 4px;
      font-size:12px;font-weight:700;color:var(--orange);letter-spacing:.02em;
    }
    .zg-divider::before,.zg-divider::after { content:'';flex:1;border-top:2px dashed var(--orange-mid); }
    .zg-divider.zg-fin { margin:4px 0 8px;font-weight:600;opacity:.85; }
    body.delib-on .zg-divider { font-size:14px; }
    .zg-replie {
      display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;margin:4px 0;
      border:1px dashed var(--border);border-radius:10px;background:var(--bg);
      font:inherit;font-size:13px;color:var(--text-muted);cursor:pointer;text-align:left;
    }
    .zg-replie b { font-family:var(--font-mono);color:var(--text); }
    .zg-replie span { margin-left:auto;font-weight:600;color:var(--indigo-dark);text-decoration:underline;text-underline-offset:2px; }
    .zg-replie:hover { border-color:var(--indigo-mid); }
    .zg-replie:focus-visible { outline:2px solid var(--indigo);outline-offset:2px; }
    .rank-infos .ri-plebiscite { color:var(--green);font-weight:700; }
    .rank-infos .ri-plebiscite .ico { width:12px;height:12px; }
    .rank-infos .ri-abst { color:var(--text-light); }

    /* Réglages d'aide sous la barre du classement */
    .classement-aides {
      flex-basis:100%;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;
      padding-top:12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-muted);
    }
    .classement-aides [hidden] { display:none !important; }
    .zg-champ { display:inline-flex;align-items:center;gap:6px;font-weight:600; }
    .zg-champ .places-input { width:52px;padding:4px 6px; }
    #zg-aide { font-weight:400; }
    .zg-pastille { width:12px;height:12px;border-radius:3px;background:var(--orange-light);border:1.5px dashed var(--orange); }
    .aide-bascule {
      padding:5px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);
      font:inherit;font-size:12.5px;font-weight:600;color:var(--text-muted);cursor:pointer;
    }
    .aide-bascule:hover { border-color:var(--orange); }
    .aide-bascule[aria-pressed="true"] { background:var(--orange-light);border-color:var(--orange);color:var(--text); }
    .aide-bascule:focus-visible { outline:2px solid var(--indigo);outline-offset:2px; }
    .sev-bascule { display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--text);cursor:pointer; }
    .sev-bascule input { width:16px;height:16px;accent-color:var(--indigo); }
    .sev-etat { font-size:12px;color:var(--text-light); }
    .sev-table-wrap { overflow-x:auto; }
    .sev-table { width:100%;border-collapse:collapse;font-size:13.5px; }
    .sev-table th { text-align:left;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:6px 8px;border-bottom:1px solid var(--border); }
    .sev-table td { padding:7px 8px;border-bottom:1px solid var(--border); }
    .sev-table .sev-n { font-family:var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap; }
    .sev-genereux { color:var(--orange);font-weight:600; }
    .sev-severe { color:var(--indigo-dark);font-weight:600; }

    /* ── Classement header ───────────────────────────────────────── */
    .classement-toolbar {
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:16px 20px;background:var(--surface);border:1px solid var(--border);
      border-radius:10px;margin-bottom:16px;
    }
    .places-input {
      width:62px;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
      font-size:14px;font-weight:700;font-family:inherit;text-align:center;
      background:var(--bg);color:var(--text);
    }
    .places-input:focus { outline:none;border-color:var(--indigo); }



    /* Point orange « À revoir » (décision d'un juré), dans le classement */
    .decision-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }

    /* ── View toggle pills ───────────────────────────────────────── */
    .view-toggle {
      display:inline-flex;gap:3px;background:var(--bg);padding:3px;
      border-radius:10px;border:1px solid var(--border);
    }
    .view-toggle-btn {
      padding:6px 14px;border-radius:7px;border:none;background:none;
      cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
      color:var(--text-muted);transition:all .14s;
      display:inline-flex;align-items:center;gap:6px;
    }
    .view-toggle-btn.active {
      background:var(--surface);color:var(--indigo);
      box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
<nav class="nav">
  <a href="/secge/dashboard.html" class="nav-brand">
    <div class="nav-brand-icon">C</div>
    <span class="nav-brand-name">Cooptly</span>
  </a>
  <div class="nav-links">
    <a href="/secge/dashboard.html" class="nav-link">Tableau de bord</a>
    <a href="/secge/candidats.html" class="nav-link active">Cooptants</a>
    <a href="/planning.html"        class="nav-link">Planning</a>
    <a href="/parametres.html"      class="nav-link">Paramètres</a>
  </div>
  <div class="nav-right">
    <button class="btn btn-ghost btn-sm" id="btn-logout">Déconnexion</button>
  </div>
</nav>

<main class="page">
  <!-- ── Header ───────────────────────────────────────────────── -->
  <div class="flex-between mb-24" id="candidats-head">
    <div><h1>Cooptants</h1><p>Réponses aux formulaires et gestion des statuts</p></div>
    <div class="flex-gap">
      <select class="form-select" id="campaign-select" style="display:none;width:220px;font-size:14px;"><option value="">Recrutement</option></select>
      <button class="btn btn-secondary" id="btn-export" title="Télécharger la liste (tableur)"><i data-icone="telecharger"></i>CSV</button>
    </div>
  </div>

  <!-- ── View toggle + Filters ────────────────────────────────── -->
  <div class="card mb-16" style="padding:12px 20px;" id="candidats-controls">

<script type="module">
import { requireSecge, logout, resolveOrgContext } from '/js/auth.js';

import { showToast, formatDatetime, telephoneCooptant, cleReponse, reponseA, texteReponse,
  reponsesOrdonnees as reponsesSelonQuestions, paramLien, pourRecherche, campaignConfig, htmlRepartitionParcours, parcoursCooptant, estQuestionParcours, couleurParcours, PARCOURS, confirmDialog } from '/js/utils.js';
import { calculerScores, scoreEffectif } from '/js/score.js';

const db = getFirestore(app);

// ─── SÉCURITÉ : échappe les caractères HTML pour éviter les injections XSS ──
// Icônes de la liste : `stroke="currentColor"` suit la couleur du texte.

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
let user, currentOrg, currentCampaign = null;
let allCandidates = [], customQuestions = [], allEvaluations = [], criteriaConfig = [];
let entretienParCooptant = {};   // candidateId → Date du premier entretien
let ivParCooptant = {};          // candidateId → premier entretien (document) : jury du tableau
let notesMap = new Map();        // notes internes (privées au bureau), voir js/notes.js
let absencesMap = new Map();     // candidateId → absences (js/absences.js)
let currentView    = 'liste';   // 'liste' | 'classement'
// Manuel par defaut : c'est le mode dans lequel on delibere. Sans ordre
// enregistre, getSortedCandidates() retombe sur le tri par score, donc
// l'affichage initial reste le meme qu'en mode auto.
let rankOrderLocal = [];        // manual order (array of candidateId)
let resultatsVote = null;       // vote des membres clos : { coeurs, abstentions, votants } (js/vote.js)
let severite = null;            // sévérité des staffeurs (js/delib.js), recalculée avec les scores
let zoneSeule = false;          // classement replié sur la zone grise

const STATUTS = ['recu','place','entretien_fait'];
const BADGES  = {
  recu:           ['badge-orange', 'Reçu'],
  place:          ['badge-blue', 'Placé'],
  entretien_fait: ['badge-green',  'Entretien passé'],
  absent:         ['badge-absent', 'Absent·e'],
};

// ─── View / sort mode toggles ────────────────────────────────────
window.setView = function(v) {
  currentView = v;
  document.body.dataset.vue = v;   // visite guidée : celle du Classement (js/tuto.js)
  document.getElementById('btn-view-liste').classList.toggle('active', v === 'liste');
  document.getElementById('btn-view-classement').classList.toggle('active', v === 'classement');
  document.getElementById('list-view').style.display       = v === 'liste'       ? '' : 'none';
  document.getElementById('classement-view').style.display = v === 'classement'  ? '' : 'none';
  document.getElementById('filtres').style.display    = v === 'liste' ? '' : 'none';
  document.getElementById('filtre-parcours').style.display = v === 'liste' ? '' : 'none';
  document.getElementById('compte-liste').style.display = v === 'liste' ? '' : 'none';
  if (v === 'classement') {
    renderRanking();
    if (user) afficherTutoSiBesoin(user);
  }
  else applyFilters();
};


// ─── Init ────────────────────────────────────────────────────────
async function init() {
  user = await requireSecge();
  // Le menu se construit EN PARALLÈLE des données : l'attendre retardait
  // tout l'affichage de la page, alors qu'il n'en conditionne rien.
  initBurgerMenu(user).catch(e => console.warn('Menu non construit :', e));
  document.getElementById('btn-logout').addEventListener('click', async () => { await logout(); location.href = '/index.html'; });

  const orgId = await resolveOrgContext(user);
  if (!orgId) return;

  const [oDoc, campSnap] = await Promise.all([
    getDoc(doc(db, 'organizations', orgId)),
    getDocs(query(collection(db, 'campaigns'), where('organizationId', '==', orgId)))
  ]);
  currentOrg = { id: orgId, ...(oDoc.exists() ? oDoc.data() : {}) };

  const camps = campSnap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.createdAt?.toMillis?.() ?? 0) - (a.createdAt?.toMillis?.() ?? 0));

  // Espace de recrutement unique : sélecteur masqué
  const sel = document.getElementById('campaign-select');
  if (sel) sel.style.display = 'none';
  if (camps.length) { await loadCampaign(camps[0]); }
  // Lien direct vers le classement (recherche rapide).
  if (paramLien('vue') === 'classement') setView('classement');

  document.getElementById('search').addEventListener('input', applyFilters);
  const selParcours = document.getElementById('filtre-parcours');
  selParcours.insertAdjacentHTML('beforeend', PARCOURS.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('') + '<option value="aucun">Non renseigné</option>');
  selParcours.addEventListener('change', applyFilters);
  // Filtre demandé par un lien du tableau de bord (« À faire »).
  const filtreLien = { 'passe-sans-eval': ['entretien_fait', 'non-evalue'], 'sans-entretien': ['sans-entretien'] }[paramLien('filtre')];
  if (filtreLien) {
    document.querySelectorAll('#filtres .filtre').forEach(b => b.setAttribute('aria-pressed', String(filtreLien.includes(b.dataset.f))));
    applyFilters();
    const url = new URL(location.href); url.searchParams.delete('filtre'); history.replaceState(null, '', url);
  }
  document.querySelectorAll('#filtres .filtre').forEach(b => b.addEventListener('click', () => {
    b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    applyFilters();
  }));
  // Tri par les en-têtes de colonne, mémorisé pour la prochaine visite.
  try { const t = JSON.parse(localStorage.getItem('_triCooptants2') || 'null'); if (t?.cle) tri = t; } catch { /* navigation privée */ }
  document.querySelectorAll('#cands-table .th-tri').forEach(b => b.addEventListener('click', () => {
    const cle = b.dataset.tri;
    // Premier clic : le sens le plus utile (score : meilleurs d'abord), second : inverse.
    tri = tri.cle === cle ? { cle, sens: -tri.sens } : { cle, sens: cle === 'score' || cle === 'evals' ? -1 : 1 };
    try { localStorage.setItem('_triCooptants2', JSON.stringify(tri)); } catch { /* navigation privée */ }
    applyFilters();
  }));
  document.getElementById('btn-export').addEventListener('click', exportCSV);

  document.getElementById('nb-places-input').addEventListener('change', async e => {
    const n = parseInt(e.target.value) || 0;
    if (currentCampaign) {
      await updateDoc(doc(db, 'campaigns', currentCampaign.id), { nbPlaces: n });
      currentCampaign.nbPlaces = n;
    }
    if (currentView === 'classement') renderRanking();
    updateDelibCounts();
  });

  const reclasser = async () => {
    rankOrderLocal = [];
    conseilOrdreManuel = false;
    if (currentCampaign) await updateDoc(doc(db, 'campaigns', currentCampaign.id), { rankOrder: [] });
    document.getElementById('btn-reset-order').style.display = 'none';
    renderRanking();
    updateDelibCounts();
  };
  document.getElementById('btn-reset-order').addEventListener('click', reclasser);
  document.getElementById('btn-delib-reclasser').addEventListener('click', reclasser);

  // Aides à la délibération : réglages partagés par le bureau (sur le recrutement).
  document.getElementById('zone-grise-input').addEventListener('change', e => {
    const n = Math.max(0, Math.min(30, parseInt(e.target.value) || 0));
    const avant = currentCampaign.zoneGrise;
    e.target.value = n;
    currentCampaign.zoneGrise = n;
    renderRanking();
    updateDelibCounts();
    enregistrerClassement({ zoneGrise: n }, () => { currentCampaign.zoneGrise = avant; renderRanking(); updateDelibCounts(); });
  });
  document.getElementById('btn-zone-seule').addEventListener('click', () => basculerZoneSeule(!zoneSeule));
  document.getElementById('corriger-severite').addEventListener('change', e => {
    const oui = e.target.checked;
    if (oui && !severite?.suffisant) {
      e.target.checked = false;
      return showToast('Pas encore assez d\'évaluations : il faut au moins 8 cooptants notés et 2 staffeurs avec 2 entretiens chacun.', 'info');
    }
    const redessiner = () => { if (currentView === 'classement') renderRanking(); else applyFilters(); };
    currentCampaign.corrigerSeverite = oui;
    redessiner();
    if (oui && rankOrderLocal.length) showToast('Ordre manuel en cours : « Reclasser selon les notes » pour classer avec les notes corrigées.', 'info');
    enregistrerClassement({ corrigerSeverite: oui }, () => { currentCampaign.corrigerSeverite = !oui; redessiner(); });
  });
  document.getElementById('btn-severite').addEventListener('click', ouvrirDetailSeverite);

  document.getElementById('btn-delib').addEventListener('click', enterDelibMode);
  document.getElementById('btn-delib-exit').addEventListener('click', exitDelibMode);
}

// ─── Load campaign data ───────────────────────────────────────────
async function loadCampaign(campaign) {
  currentCampaign  = campaign;
  criteriaConfig   = campaign.interviewCriteria || [];
  rankOrderLocal   = campaign.rankOrder || [];
  customQuestions  = campaign.formConfig?.customQuestions || [];

  document.getElementById('loading-state').style.display = '';
  document.getElementById('list-view').style.display       = 'none';
  document.getElementById('classement-view').style.display = 'none';
  document.getElementById('empty-state').style.display     = 'none';

  // Restore places count
  document.getElementById('nb-places-input').value = campaign.nbPlaces || 0;
  document.getElementById('btn-reset-order').style.display = rankOrderLocal.length ? '' : 'none';

  // Parallel: candidates + evaluations
  //
  // Les évaluations DOIVENT être filtrées par asso. Firestore refuse une
  // requête s'il ne peut pas prouver, à partir de ses seuls filtres, que
  // chaque résultat serait lisible ; or la règle de lecture dépend de
  // `organizationId`. Filtrée par campagne seulement, la requête était
  // refusée à tout membre du bureau qui n'est pas admin : la page Cooptants
  // ne s'ouvrait plus du tout pour eux. L'admin passait, d'où l'angle mort.
  const [candSnap, evalSnap, ivSnap, notes, absences] = await Promise.all([
    getDocs(query(collection(db, 'candidates'), where('campaignId', '==', campaign.id))),
    getDocs(query(collection(db, 'interview_evaluations'),
      where('organizationId', '==', campaign.organizationId),
      where('campaignId', '==', campaign.id))),
    // Pour afficher la date d'entretien directement dans la liste.
    getDocs(query(collection(db, 'interviews'), where('campaignId', '==', campaign.id))),
    chargerNotes(db, campaign.organizationId, campaign.id).catch(e => { console.warn('Notes internes illisibles :', e); return new Map(); }),
    chargerAbsences(db, campaign.organizationId, campaign.id),
  ]);
  notesMap = notes;
  absencesMap = absencesParCooptant(absences);

  entretienParCooptant = {};
  ivParCooptant = {};
  ivSnap.docs.forEach(d => {
    const iv = { id: d.id, ...d.data() };
    const t = iv.datetimeStart?.toDate?.();
    if (!iv.candidateId || !t) return;
    const deja = entretienParCooptant[iv.candidateId];
    if (!deja || t < deja) { entretienParCooptant[iv.candidateId] = t; ivParCooptant[iv.candidateId] = iv; }
  });

  allCandidates  = candSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.createdAt?.toMillis?.() ?? 0) - (b.createdAt?.toMillis?.() ?? 0));
  allEvaluations = evalSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Anciennes notes posées sur le cooptant (lisibles sans compte) : déplacées
  // une fois pour toutes dans les notes privées du bureau.
  try {
    await migrerNotes(db, notesMap, {
      organizationId: campaign.organizationId, campaignId: campaign.id,
      cooptants: allCandidates,
      entretiens: ivSnap.docs.map(d => ({ id: d.id, ...d.data() })),
    });
  } catch (e) { console.warn('Déplacement des notes internes impossible :', e); }
  allCandidates.forEach(c => {
    delete c.notesInternes;
    c._note = texteNote(notesMap, idNoteCooptant(c.id));
    c._ajustement = ajustementNote(notesMap, c.id);
  });

  computeAllScores();
  marquerAbsences();

  const withScore = allCandidates.filter(c => c._score !== null).length;
  document.getElementById('score-status').textContent =
    withScore ? `${withScore} cooptant${withScore > 1 ? 's' : ''} évalué${withScore > 1 ? 's' : ''}` : '';

  document.getElementById('loading-state').style.display = 'none';

  if (currentView === 'classement') {
    document.getElementById('classement-view').style.display = '';
    renderRanking();
  } else {
    applyFilters();
  }

  // Vote des membres (onglet Classement) : participation, puis cœurs reçus.
  brancherVote({
    db, org: currentOrg, campaign, conteneur: document.getElementById('vote-carte'),
    cooptants: () => allCandidates.map(c => cooptantPourVote(c, parcoursCooptant(c))),
    nbPlaces: () => parseInt(document.getElementById('nb-places-input').value) || 0,
    onResultats: r => { resultatsVote = r; if (currentView === 'classement') renderRanking(); },
    classer: r => persistRankOrder(classerParCoeurs(allCandidates, r.coeurs, scoreRetenu, r)),
  });

  // Lien direct vers un dossier (ligne cliquée sur le tableau de bord).
  // Le paramètre est retiré ensuite : recharger la page ne le rouvre pas.
  const dossierDemande = paramLien('dossier');
  if (dossierDemande) {
    ficheDe(dossierDemande);
    const url = new URL(location.href);
    url.searchParams.delete('dossier');
    history.replaceState(null, '', url);
  }
}

/**
 * Absences (js/absences.js) : `_absences` compte tous les créneaux manqués,
 * même replanifiés (ils restent visibles au classement) ; `_absentMaintenant`
 * dit si le créneau actuel est marqué manqué.
 */
function marquerAbsences() {
  allCandidates.forEach(c => {
    const liste = absencesMap.get(c.id) || [];
    c._absences = liste.length;
    // Évalué malgré tout (signalement par erreur) : l'évaluation l'emporte.
    c._absentMaintenant = !c._nbEvals && absentAuCreneau(liste, ivParCooptant[c.id]);
  });
}
const marqueAbsences = c => c._absences
  ? ` <span class="nb-absences" title="Ne s'est pas présenté·e à un entretien">${libelleAbsences(c._absences)}</span>` : '';

// La fiche a signalé ou retiré une absence : on relit les absences seulement.
async function rechargerAbsences() {
  absencesMap = absencesParCooptant(await chargerAbsences(db, currentCampaign.organizationId, currentCampaign.id));
  marquerAbsences();
}

// ─── Score computation ───────────────────────────────────────────
function computeAllScores() {
  calculerScores(criteriaConfig, allCandidates, allEvaluations);
  calculerSeverite();
}

/**
 * Sévérité des staffeurs (js/delib.js) : d'après la note de chaque cooptant
 * (ajustements non compris) et les staffeurs de son entretien. `_correction`
 * est en points de % ; elle ne compte que si le bureau l'a activée.
 */
function calculerSeverite() {
  const jures = iv => iv ? [iv.jury1Id, iv.jury2Id, iv.jury3Id].filter(Boolean) : [];
  severite = severiteStaffeurs(allCandidates
    .map(c => ({ id: c.id, score: scoreEffectif(c), jures: jures(ivParCooptant[c.id]) })));
  allCandidates.forEach(c => { c._correction = severite.corrections.get(c.id) || 0; });
}
const severiteActive = () => !!currentCampaign?.corrigerSeverite;

// ── Ajustement de délibération (js/notes.js) ─────────────────────
// « Je le monte d'un point » : dans l'unité du score affiché, points de %
// avec une grille chiffrée, points sur 20 sinon (note globale).
const enPourcent = c => c._score != null;
const pasAjustement = c => enPourcent(c) ? 1 : 0.5;
const bonusPct = c => (c._ajustement || 0) * (enPourcent(c) ? 1 : 5);
/** Correction de sévérité des staffeurs, en points de %, si le bureau l'a activée. */
const correctionPct = c => severiteActive() ? (c._correction || 0) : 0;
/** Score qui classe : celui des évaluations, correction des staffeurs et ajustement compris (en %). */
function scoreRetenu(c) {
  const base = c._score ?? (c._noteGlobaleAvg != null ? c._noteGlobaleAvg * 5 : null);
  return base == null ? null : base + correctionPct(c) + bonusPct(c);
}
const signe = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + (n ? String(Math.abs(n)).replace('.', ',') : '');
/** Note affichée, correction des staffeurs et ajustement compris. */
function texteScore(c) {
  const a = c._ajustement || 0;
  if (enPourcent(c)) return `${Math.round(c._score + correctionPct(c) + a)} %`;
  if (c._noteGlobaleAvg != null) return `${String(+(c._noteGlobaleAvg + correctionPct(c) / 5 + a).toFixed(1)).replace('.', ',')}/20`;
  return null;
}
/** Ce qui fait la note affichée, quand elle n'est pas la note brute des évaluations. */
function detailScore(c) {
  const base = c._score != null ? `${c._score} %` : c._noteGlobaleAvg != null ? `${String(c._noteGlobaleAvg).replace('.', ',')}/20` : '';
  const corr = correctionPct(c);
  if (!base || (!corr && !c._ajustement)) return '';
  const n = enPourcent(c) ? corr : Math.round(corr / 5 * 10) / 10;
  const corrTexte = `${signe(n)} point${Math.abs(n) > 1 ? 's' : ''}${enPourcent(c) ? '' : ' sur 20'}`;
  return `Évaluations : ${base}`
    + (corr ? ` · correction des staffeurs ${corrTexte}` : '')
    + (c._ajustement ? ` · ajustement de délibération ${signe(c._ajustement)}` : '');
}

function scoreColor(pct) {
  if (pct === null) return 'var(--text-light)';
  if (pct >= 70)    return 'var(--green)';
  if (pct >= 45)    return 'var(--orange)';
  return 'var(--red)';
}

// ─── Tableau des cooptants ───────────────────────────────────────
let tri = { cle: 'entretien', sens: 1 };
let listeAffichee = [];   // ordre du tableau, pour ↑/↓ dans la fiche

const STATUT_RANG = { recu: 0, place: 1, entretien_fait: 2, absent: 3 };

/** L'entretien est-il terminé ? (fin enregistrée, sinon début + durée) */
function entretienPasse(c) {
  const iv = ivParCooptant[c.id];
  if (!iv) return false;
  const fin = iv.datetimeEnd?.toDate?.()
    || new Date(entretienParCooptant[c.id].getTime() + campaignConfig(currentCampaign).dureeMinutes * 60000);
  return fin.getTime() <= Date.now();
}
/**
 * Statut affiché : « Entretien passé » dès que l'heure est passée, évalué ou
 * non. Le statut en base ne change pas (il n'avance qu'avec une évaluation
 * ou à la main) ; la colonne Éval. dit s'il manque l'évaluation (✗).
 */
const statutAffiche = c => c._absentMaintenant ? 'absent'
  : (c.statut === 'entretien_fait' || entretienPasse(c)) ? 'entretien_fait' : (c.statut || 'recu');
function trierTableau(cands) {
  const nom = c => pourRecherche(`${c.prenom || ''} ${c.nom || ''}`);
  const parNom = (a, b) => nom(a).localeCompare(nom(b), 'fr');
  const val = {
    nom:       c => nom(c),
    entretien: c => entretienParCooptant[c.id]?.getTime() ?? null,
    statut:    c => STATUT_RANG[statutAffiche(c)] ?? 0,
    inscription: c => c.createdAt?.toMillis?.() ?? null,
    parcours:  c => { const i = PARCOURS.indexOf(parcoursCooptant(c)); return i >= 0 ? i : null; },
    messenger: c => (c.ajouteMessenger ? 1 : 0),
    evals:     c => c._nbEvals || 0,
    score:     c => scoreRetenu(c),
  }[tri.cle] || (c => entretienParCooptant[c.id]?.getTime() ?? null);
  return [...cands].sort((a, b) => {
    const x = val(a), y = val(b);
    // Pas de valeur (pas d'entretien, pas de score) : toujours en bas.
    if (x === null && y !== null) return 1;
    if (y === null && x !== null) return -1;
    const r = x === y || (x === null && y === null) ? 0 : (x < y ? -1 : 1);
    return r * tri.sens || parNom(a, b);
  });
}

/** Ouvre la fiche partagée (js/fiche-cooptant.js) d'un cooptant de la page. */
function ficheDe(id, onglet) {
  const c = allCandidates.find(x => x.id === id);
  if (!c) return showToast('Cooptant introuvable.', 'error');
  ouvrirFiche(c, {
    org: currentOrg, campaign: currentCampaign, par: user?.email || null, onglet,
    liste: () => currentView === 'classement' ? getSortedCandidates() : listeAffichee,
    onChange: async (cc, maj) => {
      // Salle ou staffeurs changés dans la fiche : la colonne Staffeurs suit.
      (maj?.entretiens || []).forEach(e => { const iv = ivParCooptant[e.candidateId]; if (iv?.id === e.id) Object.assign(iv, e); });
      await rechargerAbsences().catch(() => {});
      if (currentView === 'classement') renderRanking(); else applyFilters();
    },
    onSupprime: idSuppr => {
      allCandidates = allCandidates.filter(x => x.id !== idSuppr);
      if (currentView === 'classement') renderRanking(); else applyFilters();
    },
  });
}

// ─── CLASSEMENT VIEW ─────────────────────────────────────────────
function getSortedCandidates() {
  let sorted;
  // Ordre manuel dès qu'il existe (premier déplacement), sinon par score.
  if (rankOrderLocal.length) {
    const indexMap = {};
    rankOrderLocal.forEach((id, i) => { indexMap[id] = i; });
    sorted = [...allCandidates].sort((a, b) => {
      const ia = indexMap[a.id] ?? 9999;
      const ib = indexMap[b.id] ?? 9999;
      if (ia !== ib) return ia - ib;
      return (b._score ?? -1) - (a._score ?? -1);
    });
  } else {
    // Auto: sort by effective score desc, unevaluated at end
    // _score (criteria %) takes priority; fallback to noteGlobale/20*100 when no numeric criteria
    // Ajustements de délibération compris (scoreRetenu).
    const eff = scoreRetenu;
    sorted = [...allCandidates].sort((a, b) => {
      const sa = eff(a), sb = eff(b);
      if (sa === null && sb === null) return 0;
      if (sa === null) return 1;
      if (sb === null) return -1;
      return sb - sa;
    });
  }
  return sorted;
}

let rangSelection = null;   // cooptant sélectionné au clavier (↑ ↓ pour le déplacer)

// Enregistrement des ajustements : une demi-seconde après le dernier clic,
// puis le classement se recalcule (s'il suit les notes).
const minuteursAjust = new Map();
let conseilOrdreManuel = false;
function planifierAjustement(c) {
  clearTimeout(minuteursAjust.get(c.id));
  minuteursAjust.set(c.id, setTimeout(async () => {
    minuteursAjust.delete(c.id);
    try {
      await enregistrerAjustement(db, notesMap, {
        organizationId: currentCampaign.organizationId, campaignId: currentCampaign.id, candidateId: c.id,
      }, c._ajustement || 0);
    } catch (err) { showToast('Ajustement non enregistré : ' + err.message, 'error'); return; }
    if (minuteursAjust.size) return;   // d'autres clics en cours : on attend le dernier
    if (!rankOrderLocal.length) renderRanking();
    else if (!conseilOrdreManuel) {
      conseilOrdreManuel = true;
      showToast('Ordre manuel en cours : « Reclasser selon les notes » pour tenir compte des ajustements.', 'info');
    }
  }, 600));
}

function renderRanking() {
  const container = document.getElementById('ranking-list');
  container.innerHTML = '';

  if (!allCandidates.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg></div><h3>Aucun cooptant reçu</h3><p>Le classement apparaîtra dès réception des premières candidatures.</p></div>';
    return;
  }

  const sorted = getSortedCandidates();
  const nbPlaces = parseInt(document.getElementById('nb-places-input').value) || 0;
  const criteresChiffres = (criteriaConfig || []).filter(cr => ['echelle', 'note'].includes(cr.type) && cr.max > 0);
  const zg = zoneActuelle(sorted.length);
  majAidesDelib(zg);
  // « Ne montrer que la zone grise » : retenus d'office et derniers repliés.
  const replie = zoneSeule && zg;
  const ligneRepliee = (n, texte) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'zg-replie';
    b.innerHTML = `<b>${n}</b> ${texte} <span>Tout afficher</span>`;
    b.addEventListener('click', () => basculerZoneSeule(false));
    container.appendChild(b);
  };
  if (replie && zg.debut > 0) ligneRepliee(zg.debut, `retenu${zg.debut > 1 ? 's' : ''} d'office, au-dessus de la zone grise`);

  sorted.forEach((c, idx) => {
    const rank = idx + 1;
    if (replie && (idx < zg.debut || idx > zg.fin)) return;
    if (zg && idx === zg.debut) {
      const div = document.createElement('div');
      div.className = 'zg-divider';
      div.textContent = `Zone grise : rangs ${zg.debut + 1} à ${zg.fin + 1}, à discuter`;
      container.appendChild(div);
    }
    if (nbPlaces > 0 && rank === nbPlaces + 1) {
      const div = document.createElement('div');
      div.className = 'cutoff-divider';
      div.textContent = `↑ ${nbPlaces} place${nbPlaces > 1 ? 's' : ''} retenue${nbPlaces > 1 ? 's' : ''}`;
      container.appendChild(div);
    }

    const nom = `${c.prenom || ''} ${c.nom || ''}`.trim() || c.email || 'Cooptant';
    const row = document.createElement('div');
    const dansZone = zg && idx >= zg.debut && idx <= zg.fin;
    row.className = `rank-row${nbPlaces > 0 ? (rank <= nbPlaces ? ' above-cut' : ' below-cut') : ''}${dansZone ? ' zone-grise' : ''}${c.id === rangSelection ? ' selection' : ''}`;
    row.dataset.candId = c.id;
    row.tabIndex = 0;
    row.setAttribute('aria-label', `${rank}. ${nom}`);

    // Poignée : seul point de départ du glisser (sinon le champ de rang
    // ne se sélectionne plus, le navigateur démarre un glisser à la place).
    const grip = document.createElement('div');
    grip.className = 'rank-grip';
    grip.textContent = '⋮⋮';
    grip.title = 'Glisser pour déplacer';
    grip.setAttribute('aria-hidden', 'true');
    row.draggable = false;
    grip.addEventListener('mousedown', () => { row.draggable = true; });
    grip.addEventListener('mouseup',   () => { row.draggable = false; });
    row.addEventListener('dragend',    () => { row.draggable = false; });
    attachDragHandlers(row, c.id);

    // Rang : un champ, taper la position voulue évite de remonter rang par rang.
    const num = document.createElement('input');
    num.type = 'text';
    num.inputMode = 'numeric';
    num.className = `rank-num-input${rank <= 3 && scoreEffectif(c) != null ? ' top' : ''}`;
    num.value = rank;
    num.title = 'Taper une position, puis Entrée';
    num.setAttribute('aria-label', `Position de ${nom}`);
    attachRankInput(num, c.id, rank, sorted.length);

    const nomEl = document.createElement('button');
    nomEl.type = 'button';
    nomEl.className = 'rank-nom';
    nomEl.innerHTML = esc(nom) + (c.langue === 'en' ? ' <span title="Entretien en anglais">🇬🇧</span>' : '') + marqueAbsences(c);
    nomEl.title = 'Voir la fiche';
    nomEl.addEventListener('click', e => { e.stopPropagation(); ficheDe(c.id); });

    // Une ligne d'infos pour classer : parcours, et où en est l'entretien.
    const ident = document.createElement('div');
    ident.className = 'rank-ident';
    const infos = [];
    const parcours = parcoursCooptant(c);
    if (parcours) infos.push(`<span title="Parcours"><i style="background:${couleurParcours(parcours)}"></i>${esc(parcours)}</span>`);
    const rdv = entretienParCooptant[c.id];
    const court = d => `${d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' })} ${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}`;
    if (!rdv) infos.push('<span>Sans entretien</span>');
    else if (statutAffiche(c) === 'absent') infos.push('<span class="ri-absent">Absent·e à l\'entretien</span>');
    else if (rdv.getTime() > Date.now()) infos.push(`<span title="Entretien à venir">Entretien ${esc(court(rdv))}</span>`);
    else if (!c._nbEvals) infos.push('<span class="ri-alerte" title="L\'entretien est passé, aucune évaluation">Pas encore évalué</span>');
    else infos.push(`<span>Évalué${c._nbEvals > 1 ? ` par ${c._nbEvals} staffeurs` : ''}</span>`);
    if (resultatsVote) {
      const coeurs = resultatsVote.coeurs.get(c.id) || 0;
      const abst = resultatsVote.abstentions?.get(c.id) || 0;
      const sur = votantsPour(c.id, resultatsVote);
      const detail = `${coeurs} coup${coeurs > 1 ? 's' : ''} de cœur sur ${sur} votant${sur > 1 ? 's' : ''}`
        + (abst ? ` (${abst} abstention${abst > 1 ? 's' : ''} : ami, coloc…)` : '');
      if (plebiscite(c.id, resultatsVote)) infos.push(`<span class="ri-plebiscite" title="Au moins deux tiers des votants le veulent : ${esc(detail)}">${icone('coche')}Plébiscité</span>`);
      if (coeurs) infos.push(`<span class="ri-coeurs" title="${esc(detail)}">${icone('coeur')}${coeurs}</span>`);
      if (abst) infos.push(`<span class="ri-abst" title="${esc(detail)}">${abst} abstention${abst > 1 ? 's' : ''}</span>`);
    }
    const infosEl = document.createElement('div');
    infosEl.className = 'rank-infos';
    infosEl.innerHTML = infos.join('');
    ident.append(nomEl, infosEl);

    // Mini-barres : un critère chacune, dans l'ordre de la grille.
    const barres = document.createElement('div');
    barres.className = 'rank-barres';
    barres.innerHTML = criteresChiffres.map(cr => {
      const m = c._criteriaAvgs?.[cr.id];
      if (!m) return `<span class="rank-barre" title="${esc(cr.label)} : pas noté"></span>`;
      const pct = Math.round(m.normalized);
      return `<span class="rank-barre" title="${esc(cr.label)} : ${m.avg.toFixed(1)}/${m.max}"><div style="width:${pct}%;background:${scoreColor(pct)};"></div></span>`;
    }).join('');

    const score = document.createElement('div');
    score.className = 'rank-score';
    const majScore = () => {
      if (c._score != null) { score.textContent = texteScore(c); score.style.color = scoreColor(c._score + correctionPct(c)); }
      else if (c._partiel) score.innerHTML = `<span class="badge badge-orange" title="Le score apparaît quand la grille est remplie en entier">${c._nbCriteresNotes}/${c._nbCriteresTotal}</span>`;
      else if (c._noteGlobaleAvg != null) score.textContent = texteScore(c);
      else { score.textContent = '·'; score.style.color = 'var(--text-light)'; }
      score.title = detailScore(c);
      score.classList.toggle('ajuste', !!score.title);
    };
    majScore();

    // Ajuster la note sur le moment (− / +), gardé dans le dossier.
    const ajust = document.createElement('div');
    ajust.className = `rank-ajust${c._ajustement ? ' actif' : ''}`;
    if (scoreEffectif(c) != null) {
      const pas = String(pasAjustement(c)).replace('.', ',');
      const unite = enPourcent(c) ? ' point de %' : ' point';
      ajust.innerHTML = `<button type="button" data-aj="-1" title="Baisser de ${pas}${unite}" aria-label="Baisser la note de ${esc(nom)}">−</button>`
        + `<span title="Ajustement de délibération">${signe(c._ajustement || 0)}</span>`
        + `<button type="button" data-aj="1" title="Monter de ${pas}${unite}" aria-label="Monter la note de ${esc(nom)}">+</button>`;
      ajust.querySelectorAll('[data-aj]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const valeur = Math.round(((c._ajustement || 0) + Number(b.dataset.aj) * pasAjustement(c)) * 100) / 100;
        c._ajustement = valeur;
        ajust.querySelector('span').textContent = signe(valeur);
        ajust.classList.toggle('actif', !!valeur);
        majScore();
        planifierAjustement(c);
      }));
    }

    const evals = document.createElement('div');
    evals.className = 'rank-evals';
    evals.textContent = c._nbEvals ? `${c._nbEvals} ✓` : '';
    evals.title = c._nbEvals ? `${c._nbEvals} évaluation${c._nbEvals > 1 ? 's' : ''}` : 'Pas encore évalué';
    if (c._decisions?.reserve) evals.innerHTML += ' <span class="decision-dot" style="background:var(--orange);display:inline-block;" title="À revoir"></span>';

    // Clic sur la ligne : la sélectionner pour la déplacer au clavier.
    row.addEventListener('click', e => {
      if (e.target.closest('input, button')) return;
      selectionnerRang(c.id);
    });

    row.append(grip, num, ident, barres, score, ajust, evals);
    container.appendChild(row);
    if (zg && idx === zg.fin && !replie && idx < sorted.length - 1) {
      const fin = document.createElement('div');
      fin.className = 'zg-divider zg-fin';
      fin.textContent = 'Fin de la zone grise';
      container.appendChild(fin);
    }
  });
  if (replie && zg.fin < sorted.length - 1) {
    const n = sorted.length - zg.fin - 1;
    ligneRepliee(n, `en dessous de la zone grise`);
  }
  if (rangSelection) container.querySelector(`.rank-row[data-cand-id="${CSS.escape(rangSelection)}"]`)?.focus({ preventScroll: true });
  majProfilClassement(sorted, nbPlaces);
}

/** Fenêtre « Sévérité des staffeurs » : l'écart de chacun, et comment il est calculé. */
async function ouvrirDetailSeverite() {
  const effets = [...(severite?.effets || new Map())].sort((a, b) => b[1].effet - a[1].effet);
  const noms = await nomsJures(effets.map(([id]) => id));
  // Unité du score affiché : points de % avec une grille chiffrée, sinon points sur 20.
  const enPct = allCandidates.some(enPourcent);
  const points = v => {
    const n = enPct ? v : Math.round(v / 5 * 10) / 10;
    return `${signe(n)} point${Math.abs(n) > 1 ? 's' : ''}${enPct ? '' : ' sur 20'}`;
  };
  // Verdict à partir de 5 points de % (1 point sur 20) : en dessous, l'écart ne change presque rien.
  const verdict = e => e >= 5 ? '<span class="sev-genereux">plus généreux</span>'
    : e <= -5 ? '<span class="sev-severe">plus sévère</span>' : '<span class="text-muted">dans la moyenne</span>';
  const fond = document.createElement('div');
  fond.className = 'fiche-overlay open';
  fond.innerHTML = `<div class="fiche vote-dialogue" role="dialog" aria-modal="true" aria-labelledby="sev-titre">
    <div class="fiche-tete"><div style="flex:1;"><div class="fiche-k">Délibération</div><h3 id="sev-titre">Sévérité des staffeurs</h3></div>
      <button type="button" class="fiche-btn-icone" data-fermer aria-label="Fermer">✕</button></div>
    <div class="fiche-corps">
      <p class="vote-carte-texte">Chaque cooptant n'est noté que par les staffeurs de son entretien. Quand les cooptants d'un staffeur ont, en moyenne, de meilleures notes que les autres, il est compté comme plus généreux, et cet écart est retiré à ses cooptants. C'est l'inverse pour un staffeur plus sévère.</p>
      <p class="vote-carte-texte">Un staffeur qui a fait peu d'entretiens n'est corrigé qu'en partie : deux ou trois bons cooptants ne suffisent pas à le dire généreux. Le calcul suppose que les cooptants sont répartis au hasard : un staffeur qui n'a fait que les entretiens d'un jour ou d'un groupe particulier peut sembler généreux à cause de ses cooptants.</p>
      ${severite?.suffisant ? `<div class="sev-table-wrap"><table class="sev-table">
        <thead><tr><th scope="col">Staffeur</th><th scope="col">Entretiens notés</th><th scope="col">Écart</th><th scope="col"></th></tr></thead>
        <tbody>${effets.map(([id, e], i) => `<tr><td>${esc(noms[i] || 'Staffeur inconnu')}</td><td class="sev-n">${e.n}</td><td class="sev-n">${points(e.effet)}</td><td>${verdict(e.effet)}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="text-sm text-muted" style="margin:0;">Écart comparé à l'entretien moyen. Une note corrigée retire la moyenne des écarts des staffeurs de son entretien, ${enPct ? '15 points' : '3 points sur 20'} au plus. La moyenne de toutes les notes ne change pas : seul l'ordre bouge.</p>`
      : '<p class="vote-garde-fou">Pas encore assez d\'évaluations : il faut au moins 8 cooptants notés et 2 staffeurs avec 2 entretiens chacun.</p>'}
    </div>
    <div class="fiche-pied"><button type="button" class="btn btn-secondary btn-sm" data-fermer style="margin-left:auto;">Fermer</button></div>
  </div>`;
  document.body.appendChild(fond);
  const fermer = () => { fond.remove(); document.removeEventListener('keydown', echap); };
  const echap = e => { if (e.key === 'Escape') fermer(); };
  document.addEventListener('keydown', echap);
  fond.addEventListener('click', e => { if (e.target === fond || e.target.closest('[data-fermer]')) fermer(); });
  fond.querySelector('[data-fermer]').focus();
}

/**
 * Au-dessus du classement (onglet Classement et délibération) : où en sont
 * les entretiens, et la répartition par parcours des retenus (au-dessus de
 * la ligne) et de tous. Recalculé à chaque déplacement.
 */
function majProfilClassement(classes, nbPlaces) {
  const profil = document.getElementById('delib-profil');
  if (!classes.length) { profil.innerHTML = ''; return; }
  const maintenant = Date.now();
  const avecRdv = classes.filter(c => entretienParCooptant[c.id]);
  const absents = classes.filter(c => statutAffiche(c) === 'absent').length;
  const passes = avecRdv.filter(c => entretienParCooptant[c.id].getTime() <= maintenant && statutAffiche(c) !== 'absent');
  const evalues = classes.filter(c => c._nbEvals > 0).length;
  const chiffre = (n, lbl) => `<span><b>${n}</b> ${lbl}</span>`;
  profil.innerHTML = `<div class="dp-chiffres">
      ${chiffre(`${evalues}/${classes.length}`, 'évalués')}
      ${chiffre(passes.length, `entretien${passes.length > 1 ? 's' : ''} passé${passes.length > 1 ? 's' : ''}`)}
      ${chiffre(avecRdv.length - passes.length - absents, 'à venir')}
      ${absents ? chiffre(absents, `absent${absents > 1 ? 's' : ''}`) : ''}
      ${classes.length - avecRdv.length ? chiffre(classes.length - avecRdv.length, 'sans entretien') : ''}
    </div>`
    + (classes.some(parcoursCooptant)
      ? htmlRepartitionParcours([
          ...(nbPlaces > 0 ? [{ titre: 'Retenus', cooptants: classes.slice(0, nbPlaces) }] : []),
          { titre: 'Tous les cooptants', cooptants: classes },
        ])
      : '');
}

function selectionnerRang(id) {
  rangSelection = rangSelection === id ? null : id;
  document.querySelectorAll('#ranking-list .rank-row').forEach(r => r.classList.toggle('selection', r.dataset.candId === rangSelection));
  if (rangSelection) document.querySelector(`#ranking-list .rank-row[data-cand-id="${CSS.escape(rangSelection)}"]`)?.focus({ preventScroll: true });
}

// Clavier : ↑ ↓ déplacent la ligne sélectionnée (Maj : de 5 rangs), Entrée
// ouvre sa fiche, Échap désélectionne. Rien quand la fiche est ouverte ou
// qu'on tape dans un champ.
document.addEventListener('keydown', async e => {
  if (currentView !== 'classement' || !rangSelection || document.body.classList.contains('fiche-on')) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (e.key === 'Escape' && !document.fullscreenElement) { selectionnerRang(rangSelection); return; }
  if (e.key === 'Enter') { e.preventDefault(); ficheDe(rangSelection); return; }
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const ids = getSortedCandidates().map(c => c.id);
  const de = ids.indexOf(rangSelection);
  if (de < 0) return;
  const pas = e.shiftKey ? 5 : 1;
  const vers = Math.min(Math.max(de + (e.key === 'ArrowUp' ? -pas : pas), 0), ids.length - 1);
  if (vers === de) return;
  await moveCandidateToPosition(rangSelection, vers + 1, { garderSelection: true });
  document.querySelector(`#ranking-list .rank-row[data-cand-id="${CSS.escape(rangSelection)}"]`)?.scrollIntoView({ block: 'nearest' });
});

// ─── Mode délibération ───────────────────────────────────────────
// Plein écran de réunion : on masque le chrome, on agrandit les lignes et on
// affiche en permanence le décompte retenus / places. L'ordre reste le même
// objet `rankOrder` : c'est la même donnée, juste présentée pour un groupe.

function updateDelibCounts() {
  if (!document.body.classList.contains('delib-on')) return;
  const total    = allCandidates.length;
  const nbPlaces = parseInt(document.getElementById('nb-places-input').value) || 0;
  const retenus  = nbPlaces > 0 ? Math.min(nbPlaces, total) : total;
  const evalues  = allCandidates.filter(c => c._nbEvals > 0).length;

  const cell = (val, lbl) =>
    `<div><div class="delib-count-val">${val}</div><div class="delib-count-lbl">${lbl}</div></div>`;
  const zg = zoneActuelle(total);
  document.getElementById('delib-counts').innerHTML =
    cell(retenus, 'retenus') + (zg ? cell(zg.fin - zg.debut + 1, 'à discuter') : '')
    + cell(total, 'cooptants') + cell(`${evalues}/${total}`, 'évalués');
  document.getElementById('btn-delib-reclasser').style.display = rankOrderLocal.length ? '' : 'none';


  document.getElementById('delib-sub').textContent = nbPlaces > 0
    ? `${nbPlaces} place${nbPlaces > 1 ? 's' : ''}, glisse les lignes pour réordonner`
    : 'Aucune limite de places, glisse les lignes pour réordonner';
}

async function enterDelibMode() {
  document.body.classList.add('delib-on');
  renderRanking();
  updateDelibCounts();
  try { await document.documentElement.requestFullscreen(); }
  catch { /* refus ou non supporté : le mode reste utilisable sans plein écran */ }
}

async function exitDelibMode() {
  fermerFiche();
  document.body.classList.remove('delib-on');
  renderRanking();
  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch { /* ignore */ }

// Sortie via Échap ou le bouton natif du navigateur : garder le CSS synchronisé.
document.addEventListener('fullscreenchange', () => {

    fermerFiche();
    document.body.classList.remove('delib-on');

// ─── Glisser-déposer du classement ───────────────────────────────
let _dragCandId = null;

function clearDropMarks() {
  document.querySelectorAll('.rank-row.drop-above, .rank-row.drop-below')
    .forEach(r => r.classList.remove('drop-above', 'drop-below'));
}

function attachDragHandlers(row, candId) {
  row.addEventListener('dragstart', e => {
    _dragCandId = candId;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox exige des données pour déclencher le drag
    e.dataTransfer.setData('text/plain', candId);
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    clearDropMarks();
    _dragCandId = null;
  });

  row.addEventListener('dragover', e => {
    if (!_dragCandId || _dragCandId === candId) return;
    e.preventDefault();                       // autorise le drop
    e.dataTransfer.dropEffect = 'move';
    // Au-dessus ou en dessous, selon la moitié de ligne survolée
    const r = row.getBoundingClientRect();
    const before = (e.clientY - r.top) < r.height / 2;
    row.classList.toggle('drop-above', before);
    row.classList.toggle('drop-below', !before);
  });

  row.addEventListener('dragleave', () => row.classList.remove('drop-above', 'drop-below'));

  row.addEventListener('drop', async e => {
    e.preventDefault();
    const dragged = _dragCandId;
    const before  = row.classList.contains('drop-above');
    clearDropMarks();
    if (!dragged || dragged === candId) return;
    await reorderCandidate(dragged, candId, before);
  });
}

/**
 * Champ de position : taper un rang et valider deplace le cooptant a cet
 * endroit. Entree valide, Echap annule, et sortir du champ valide aussi
 * (on tape souvent un chiffre puis on clique ailleurs).
 */
function attachRankInput(input, candId, currentRank, total) {
  let annule = false;

  const valider = async () => {
    if (annule) return;
    const val = parseInt(input.value, 10);

    // Saisie vide ou non numerique : on remet la valeur affichee.
    if (isNaN(val)) { input.value = currentRank; return; }

    // Bornes : 1 = premier, total = dernier. On clampe plutot que de refuser,
    // « 99 » veut clairement dire « tout en bas ».
    const cible = Math.min(Math.max(val, 1), total);
    if (cible === currentRank) { input.value = currentRank; return; }

    await moveCandidateToPosition(candId, cible);
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { annule = true; input.value = currentRank; input.blur(); }
  });
  input.addEventListener('blur', valider);
  // Selectionner tout au focus : on remplace le numero, on ne l'edite pas.
  input.addEventListener('focus', () => input.select());
}

/** Place `candId` a la position `pos` (1 = premier) et persiste l'ordre. */
async function moveCandidateToPosition(candId, pos, { garderSelection = false } = {}) {
  const ids = getSortedCandidates().map(c => c.id);
  if (!ids.includes(candId)) return;

  const next = ids.filter(id => id !== candId);
  // pos est en base 1 ; apres retrait, l'insertion se fait a pos-1.
  next.splice(Math.min(Math.max(pos - 1, 0), next.length), 0, candId);

  await persistRankOrder(next);

  // Redonner le focus au champ deplace : on enchaine souvent plusieurs
  // repositionnements pendant une deliberation.
  if (garderSelection) return;
  requestAnimationFrame(() => {
    const row = document.querySelector(`.rank-row[data-cand-id="${candId}"]`);
    row?.querySelector('.rank-num-input')?.focus();
  });
}

/** Déplace `draggedId` juste avant/après `targetId` et persiste l'ordre. */
async function reorderCandidate(draggedId, targetId, before) {
  const ids = getSortedCandidates().map(c => c.id);

  // On valide AVANT de muter : retirer puis abandonner sur cible introuvable
  // ferait disparaître le cooptant de la liste.
  if (draggedId === targetId) return;
  if (!ids.includes(draggedId) || !ids.includes(targetId)) return;

  const next = ids.filter(id => id !== draggedId);
  const to   = next.indexOf(targetId);
  next.splice(before ? to : to + 1, 0, draggedId);

  await persistRankOrder(next);
}

/** Enregistre l'ordre du classement : partagé par les flèches et le drag&drop. */
async function persistRankOrder(ids) {
  const previous = rankOrderLocal;
  rankOrderLocal = ids;
  renderRanking();                            // retour visuel immédiat
  updateDelibCounts();
  try {
    await updateDoc(doc(db, 'campaigns', currentCampaign.id), { rankOrder: ids });
    currentCampaign.rankOrder = ids;
    document.getElementById('btn-reset-order').style.display = '';
  } catch (err) {
    // Ne pas laisser l'écran mentir sur un ordre qui n'a pas été enregistré.
    rankOrderLocal = previous;
    renderRanking();
    updateDelibCounts();
    showToast('Ordre non enregistré : ' + err.message, 'error');
  }
}


// ─── Filters (list mode only) ─────────────────────────────────────
// ─── Modifier le profil d'un cooptant ─────────────────────────────
/**
 * Formulaire d'édition dans la fiche dépliée : prénom, nom, email et toutes
 * les questions du formulaire (même celles restées sans réponse, par exemple
 * pour quelqu'un inscrit sur un stand). Les réponses sont rangées sous la même
 * clé que celles du cooptant (`cleReponse`), jamais par position.
 */
/**
 * Filtres en pastilles. Les statuts cochés s'additionnent (Reçus OU Placés),
 * les autres filtres se cumulent (sans entretien ET en anglais).
 */
function passeFiltres(c, actifs) {
  const statuts = actifs.filter(f => f in STATUT_RANG);
  if (statuts.length && !statuts.includes(statutAffiche(c))) return false;
  if (actifs.includes('sans-entretien') && entretienParCooptant[c.id]) return false;
  if (actifs.includes('non-evalue') && (c._nbEvals || c._absentMaintenant)) return false;
  if (actifs.includes('messenger-non') && c.ajouteMessenger) return false;
  if (actifs.includes('en') && c.langue !== 'en') return false;
  const parcours = document.getElementById('filtre-parcours').value;
  if (parcours && (parcoursCooptant(c) || 'aucun') !== parcours) return false;
  return true;
}

function applyFilters() {
  if (currentView === 'classement') { renderRanking(); return; }
  // Sans accents : « celeste » trouve « Céleste ».
  const s = pourRecherche(document.getElementById('search').value);
  const actifs = [...document.querySelectorAll('#filtres .filtre[aria-pressed="true"]')].map(b => b.dataset.f);
  const affiches = allCandidates.filter(c =>
    (!s || pourRecherche(`${c.prenom} ${c.nom} ${c.email}`).includes(s)) && passeFiltres(c, actifs));
  renderTable(trierTableau(affiches));
  // Répartition par parcours : la liste affichée si elle est filtrée, et tous.
  document.getElementById('liste-profil').innerHTML = allCandidates.some(parcoursCooptant)
    ? htmlRepartitionParcours([
        ...(affiches.length !== allCandidates.length ? [{ titre: 'Affichés', cooptants: affiches }] : []),
        { titre: 'Tous les cooptants', cooptants: allCandidates },
      ])
    : '';
}

// ─── Réponses au formulaire ───────────────────────────────────────
// La logique vit dans utils.js (partagée avec le popup du planning).
function reponsesOrdonnees(c) { return reponsesSelonQuestions(c, customQuestions); }

// ─── CSV Export ───────────────────────────────────────────────────
function exportCSV() {
  if (!allCandidates.length) return showToast('Aucun cooptant à exporter.', 'error');

  // Ce que l'export faisait mal, et qu'il ne faut pas réintroduire :
  //  - intitulés non entre guillemets : une question contenant une virgule
  //    (« …relations humaines, etc. ») se coupait en plusieurs colonnes et
  //    décalait tout le fichier ;
  //  - séparateur « , » : Excel en français attend « ; » et mettait tout dans
  //    une seule colonne ;
  //  - téléphone lu dans l'ancien champ fixe (vide) ;
  //  - statut brut (« place »), zéro effacé par `v || ''` ;
  //  - colonnes d'évaluation toutes vides tant que personne n'est évalué.
  const SEP = ';';
  const cellule = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const nombre  = (v, dec = 0) => v === null || v === undefined || v === '' ? '' : Number(v).toFixed(dec).replace('.', ',');
  const hm = d => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

  const sorted  = getSortedCandidates();
  const evalues = allCandidates.some(c => c._nbEvals > 0);
  // Le rang n'a de sens qu'une fois un classement établi (scores ou ordre manuel).
  const classe  = evalues || rankOrderLocal.length > 0;

  // Téléphone : colonne dédiée, donc la question correspondante n'est pas répétée.
  const questionsTel = new Set(sorted.map(c => {
    const t = telephoneCooptant(c, customQuestions);
    return customQuestions.findIndex((q, qi) => t && texteReponse(reponseA(c, q, qi)).trim() === t);
  }).filter(i => i >= 0));
  // L'ancienne question « Parcours » de l'asso : déjà dans la colonne Parcours.
  const questions = customQuestions.map((q, qi) => ({ q, qi })).filter(({ q, qi }) => !questionsTel.has(qi) && !estQuestionParcours(q));

  const colonnes = [];
  if (classe) colonnes.push(['Rang', (c, i) => i + 1]);
  colonnes.push(
    ['Prénom', c => c.prenom],
    ['Nom', c => c.nom],
    ['Email', c => c.email],
    ['Parcours', c => parcoursCooptant(c) || ''],
    ['Téléphone', c => telephoneCooptant(c, customQuestions)],
    ['Statut', c => BADGES[c.statut]?.[1] || c.statut || ''],
    ['Messenger', c => c.ajouteMessenger ? 'oui' : 'non'],
    ['Absences', c => c._absences || ''],
    ['Entretien', c => {
      const d = entretienParCooptant[c.id];
      return d ? `${d.toLocaleDateString('fr-FR')} ${hm(d)}` : '';
    }],
  );
  questions.forEach(({ q, qi }) => colonnes.push([q.label, c => texteReponse(reponseA(c, q, qi))]));
  if (evalues) {
    colonnes.push(
      ['Score %', c => nombre(c._score)],
      ['Critères notés', c => c._nbCriteresTotal && c._nbEvals ? `${c._nbCriteresNotes}/${c._nbCriteresTotal}` : ''],
      ['Nb évaluations', c => c._nbEvals || ''],
      ['Note globale /20', c => nombre(c._noteGlobaleAvg, 1)],
      ...(severiteActive() ? [['Correction staffeurs (points de %)', c => c._correction ? nombre(c._correction, 1) : '']] : []),
      ['Ajustement délibération', c => c._ajustement ? nombre(c._ajustement, 1) : ''],
      ['Note retenue', c => texteScore(c) || ''],
    );
    criteriaConfig.forEach(cr => colonnes.push([`Critère : ${cr.label}`, c => {
      // Chaque type a sa propre lecture : la moyenne n'a de sens que pour les
      // critères chiffrés, les autres exportent leur réponse agrégée.
      const avg = c._criteriaAvgs?.[cr.id];
      if (avg) return nombre(avg.avg, 2);
      const choice = c._choiceAnswers?.find(x => x.id === cr.id);
      if (choice) return choice.items.map(i => `${i.option} (${i.n}/${choice.total})`).join(' · ');
      const yn = c._yesnoAnswers?.find(x => x.id === cr.id);
      if (yn) return cr.type === 'check' ? `${yn.oui}/${yn.total}` : `oui ${yn.oui} / non ${yn.non}`;
      const txt = c._textAnswers?.find(x => x.id === cr.id);
      if (txt) return txt.values.join(' | ');
      return '';
    }]));
    colonnes.push(['Commentaires des staffeurs', c => (c._comments || []).map(cm => cm.text).join(' | ')]);
  }
  // Vote des membres, une fois clos (avant, les bulletins sont illisibles).
  if (resultatsVote) {
    colonnes.push(
      ['Coups de cœur', c => resultatsVote.coeurs.get(c.id) || 0],
      ['Votants (hors abstentions)', c => votantsPour(c.id, resultatsVote)],
      ['Abstentions au vote', c => resultatsVote.abstentions?.get(c.id) || ''],
      ['Plébiscité', c => plebiscite(c.id, resultatsVote) ? 'oui' : ''],
    );
  }
  const zgExport = zoneActuelle(sorted.length);
  if (zgExport) colonnes.push(['Zone grise', (c, i) => i >= zgExport.debut && i <= zgExport.fin ? 'oui' : '']);
  colonnes.push(
    ['Notes internes', c => c._note || ''],
    ['Candidature reçue le', c => c.createdAt ? formatDatetime(c.createdAt) : ''],
  );

  const lignes = [
    colonnes.map(([titre]) => cellule(titre)).join(SEP),
    ...sorted.map((c, i) => colonnes.map(([, val]) => cellule(val(c, i))).join(SEP)),
  ];
  // BOM : sans lui, Excel lit les accents de travers. \r\n : fin de ligne attendue par Excel.
  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const nomAsso = (currentOrg?.slug || 'asso').replace(/[^a-z0-9-]/gi, '');
  const a = document.createElement('a'); a.href = url; a.download = `cooptants-${nomAsso}-${localDateISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export CSV téléchargé.', 'success');
}

function localDateISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

init();

// Évaluation enregistrée depuis une fiche : les scores et le classement changent.
window.addEventListener('message', e => {
  if (e.origin === location.origin && e.data === 'eval-saved' && currentCampaign) loadCampaign(currentCampaign);
});

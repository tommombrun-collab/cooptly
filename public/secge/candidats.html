<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem("_theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooptants · Sec-gé Cooptly</title>
  <!-- Connexions ouvertes d'avance : sans elles, chaque serveur (polices,
       SDK, base de données) coûtait sa propre poignée de main réseau au
       moment où la page en avait besoin. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Le SDK est préchargé dès l'en-tête. Sinon le navigateur ne le
       découvre qu'en arrivant au script, tout en bas de la page. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" />
  <!-- Polices en <link> et non plus en @import dans main.css : l'@import
       obligeait à télécharger la feuille de style avant même de découvrir
       les polices, trois allers-retours à la suite avant le texte. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antic&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    /* ── Score ring SVG ──────────────────────────────────────────── */
    .score-ring-wrap {
      display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;
    }
    .score-ring-label {
      font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:.03em;
    }

    /* ── Mini criterion bar ──────────────────────────────────────── */
    .crit-bar-row {
      display:flex;align-items:center;gap:8px;
      font-size:12px;color:var(--text-muted);margin-bottom:5px;
    }
    .crit-bar-label { min-width:110px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .crit-bar-track {
      flex:1;height:6px;border-radius:99px;background:var(--border);overflow:hidden;
    }
    .crit-bar-fill  { height:100%;border-radius:99px;transition:width .3s; }
    .crit-bar-value { min-width:36px;text-align:right;font-weight:600;color:var(--text); }

    /* ── Ranking rows ────────────────────────────────────────────── */
    .rank-row {
      display:flex;align-items:center;gap:10px;
      padding:9px 14px;background:var(--surface);border:1px solid var(--border);
      border-radius:10px;transition:border-color .12s;position:relative;
    }
    .rank-row:hover { border-color:var(--indigo-mid); }
    .rank-row.above-cut { border-left:3px solid var(--green); }
    .rank-row.below-cut { opacity:.75; }

    /* ── Glisser-déposer du classement (mode manuel) ───────────── */
    .rank-row.draggable { cursor:grab; }
    .rank-row.draggable:active { cursor:grabbing; }
    .rank-row.dragging { opacity:.4; }
    .rank-row.drop-above { box-shadow:inset 0 3px 0 var(--indigo); }
    .rank-row.drop-below { box-shadow:inset 0 -3px 0 var(--indigo); }
    .rank-grip {
      flex-shrink:0;width:16px;color:var(--text-muted);font-size:13px;line-height:1;
      cursor:grab;user-select:none;text-align:center;
    }
    .rank-grip:active { cursor:grabbing; }

    /* ── Mode délibération (plein écran de réunion) ─────────────── */
    #delib-bar { display:none; }
    body.delib-on #delib-bar {
      display:flex;align-items:center;gap:20px;
      padding:16px 22px;margin-bottom:16px;
      /* --indigo-dark et non --indigo : ce bandeau est lu à distance en réunion,
         et le blanc sur --indigo ne donne que 3.4:1 (sous le seuil AA). */
      background:var(--indigo-dark);color:#fff;border-radius:14px;
    }
    #delib-title { font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2; }
    #delib-sub   { font-size:12.5px;opacity:.92;margin-top:2px; }
    #delib-counts { margin-left:auto;display:flex;gap:22px;font-family:var(--font-mono);text-align:center; }
    .delib-count-val { font-size:24px;font-weight:700;line-height:1.1; }
    /* Hiérarchie par la taille et l'espacement, pas par un contraste faible. */
    .delib-count-lbl { font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;opacity:.92; }
    body.delib-on #delib-bar .btn { background:rgba(255,255,255,.16);color:#fff;border-color:transparent; }

    /* En délibération on masque tout le chrome : seul le classement compte. */
    body.delib-on .nav,
    body.delib-on #candidats-head,
    body.delib-on #candidats-controls,
    body.delib-on #list-view,
    body.delib-on #evals-view,
    body.delib-on #btn-delib { display:none !important; }
    body.delib-on .page { max-width:1100px;padding-top:18px; }
    /* Lisible à distance : lignes plus hautes, texte plus gros. */
    body.delib-on .rank-row   { padding:14px 18px;gap:14px; }
    body.delib-on .rank-name  { font-size:16px; }
    body.delib-on .rank-email { font-size:12px; }
    body.delib-on .rank-num   { width:34px;height:34px;font-size:14px; }
    body.delib-on .rank-avatar{ width:38px;height:38px;font-size:14px; }
    body.delib-on .cutoff-divider { font-size:14px;padding:10px 0; }

    .rank-num {
      width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:800;flex-shrink:0;color:var(--text-muted);background:var(--bg);
    }
    .rank-num.top { background:var(--indigo);color:#fff; }

    /* Champ de position : garde l'allure du badge, mais editable. */
    .rank-num-input {
      width:34px;height:28px;padding:0;text-align:center;
      border:1.5px solid var(--border);border-radius:7px;
      font-family:inherit;font-size:12px;font-weight:800;
      background:var(--bg);color:var(--text-muted);
      cursor:text;transition:border-color .12s,background .12s,color .12s;
      -moz-appearance:textfield;
    }
    .rank-num-input.top { background:var(--indigo);color:#fff;border-color:var(--indigo); }
    .rank-num-input:hover { border-color:var(--indigo-mid); }
    .rank-num-input:focus {
      outline:none;border-color:var(--indigo);
      background:var(--surface);color:var(--text);
      box-shadow:0 0 0 3px var(--indigo-light);
    }
    /* En délibération le champ doit rester cliquable de loin. */
    body.delib-on .rank-num-input { width:44px;height:36px;font-size:15px; }
    /* Sur mobile le glisser-déposer HTML5 ne marche pas : la saisie du rang est
       le seul moyen de réordonner, elle doit donc être confortable au doigt. */
    @media (max-width: 640px) {
      .rank-num-input { width:42px;height:38px;font-size:14px; }
      .rank-grip { display:none; }
    }

    .rank-avatar {
      width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:13px;color:var(--indigo);background:var(--indigo-light);flex-shrink:0;
    }

    .rank-info { flex:1;min-width:0; }
    .rank-name { font-weight:700;font-size:13px; }
    .rank-email { font-size:11px;color:var(--text-muted); }
    .rank-crits { display:flex;gap:5px;flex-wrap:wrap;margin-top:3px; }
    .rank-crit-chip {
      font-size:10px;padding:2px 7px;border-radius:99px;
      background:var(--bg);border:1px solid var(--border);color:var(--text-muted);
      font-weight:600;display:inline-flex;align-items:center;gap:4px;
    }
    .rank-crit-name {
      max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }

    .rank-score-block { display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;min-width:50px; }
    .rank-score-sub { font-size:10px;color:var(--text-muted); }

    /* ── Eval side panel ─────────────────────────────────────────── */
    #eval-panel-overlay {
      position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:900;
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    #eval-panel-overlay.open { opacity:1;pointer-events:all; }
    #eval-panel {
      position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);
      background:var(--surface);box-shadow:-4px 0 24px rgba(0,0,0,.15);
      z-index:901;display:flex;flex-direction:column;
      transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);
    }
    #eval-panel.open { transform:translateX(0); }
    #eval-panel-header {
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0;
    }
    #eval-panel iframe { flex:1;border:none;width:100%; }

    /* ── Fenêtre dossier ─────────────────────────────────────────────
       Fenêtre centrée, comme celle du tableau de bord. Consultable pendant les
       délibérations : on relit une motivation sans perdre l'ordre en cours. */
    #dossier-panel {
      position:fixed;top:50%;left:50%;z-index:9991;
      width:min(640px,calc(100vw - 32px));max-height:calc(100dvh - 32px);
      background:var(--surface);border:1px solid var(--border);border-radius:18px;
      box-shadow:0 24px 64px rgba(0,0,0,.22), 0 4px 16px rgba(0,0,0,.08);
      display:flex;flex-direction:column;
      opacity:0;pointer-events:none;transform:translate(-50%,-48%) scale(.98);
      transition:opacity .18s ease, transform .18s ease;
    }
    #dossier-panel.open { opacity:1;pointer-events:auto;transform:translate(-50%,-50%); }
    @media (prefers-reduced-motion: reduce) { #dossier-panel { transition:none; } }
    /* Projeté en réunion : plus large et plus lisible de loin. */
    body.delib-on #dossier-panel { width:min(780px,calc(100vw - 32px));font-size:15px; }
    body.delib-on .dossier-value { font-size:15.5px;line-height:1.65; }
    #dossier-header {
      display:flex;align-items:flex-start;gap:12px;
      padding:20px 22px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
    }
    #dossier-body { flex:1;overflow-y:auto;padding:18px 22px; }
    #dossier-overlay {
      position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:9990;
      opacity:0;pointer-events:none;transition:opacity .18s;
    }
    body.dossier-on #dossier-overlay { opacity:1;pointer-events:all; }
    .cp-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px; }
    .cp-tile { background:var(--bg);border-radius:10px;padding:9px 12px; }
    .cp-k { font-size:11px;font-weight:600;color:var(--text-muted); }
    .cp-v { font-size:13.5px;font-weight:600;margin-top:2px;overflow-wrap:anywhere; }
    .cp-v a { color:inherit; }
    .cp-crayon { text-decoration:none;margin-left:6px;padding:2px 6px;border-radius:6px;border:1px solid var(--border);font-size:13px; }
    .cp-crayon:hover { border-color:var(--indigo);background:var(--indigo-light); }
    .cp-crayon:focus-visible { outline:2px solid var(--indigo);outline-offset:2px; }
    #dossier-nav { display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0; }
    #dossier-meta { display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px; }
    .dossier-section-title {
      font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
      /* --text-light tombe a 2.86:1, sous le seuil AA de 4.5:1 exige pour du
         petit texte. --text-muted tient 5.14:1 en clair, 6.78:1 en sombre. */
      color:var(--text-muted);margin:20px 0 8px;
    }
    .dossier-section-title:first-child { margin-top:0; }
    .dossier-qa { background:var(--bg);border-radius:10px;padding:12px 16px;margin-bottom:8px; }
    .dossier-label { font-size:12.5px;color:var(--text-muted);margin-bottom:4px; }
    .dossier-value { font-weight:500;line-height:1.6;white-space:pre-wrap;word-break:break-word; }
    .dossier-quote {
      /* --indigo-mid tombe a 1.66:1 sur le fond sombre : la barre d'accent
         disparaissait purement et simplement en theme sombre. */
      background:var(--bg);border-left:3px solid var(--indigo);
      border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:8px;
      font-style:italic;line-height:1.6;white-space:pre-wrap;
    }
    .dossier-empty { color:var(--text-muted);font-size:13px;padding:8px 0; }

    .rank-actions { display:flex;flex-direction:column;gap:5px;flex-shrink:0; }
    .rank-move-btn {
      width:26px;height:26px;border-radius:6px;border:1.5px solid var(--border);
      background:var(--bg);cursor:pointer;font-size:11px;
      display:flex;align-items:center;justify-content:center;
      transition:all .12s;color:var(--text-muted);
    }
    .rank-move-btn:hover:not(:disabled) { border-color:var(--indigo);color:var(--indigo);background:var(--indigo-light); }
    .rank-move-btn:disabled { opacity:.35;cursor:default; }

    /* ── Cutoff divider ──────────────────────────────────────────── */
    .cutoff-divider {
      display:flex;align-items:center;gap:10px;
      margin:8px 0;font-size:12px;font-weight:700;
      color:var(--green);letter-spacing:.02em;
    }
    .cutoff-divider::before,.cutoff-divider::after {
      content:'';flex:1;height:2px;border-radius:1px;background:var(--green);
    }

    /* ── Classement header ───────────────────────────────────────── */
    .classement-toolbar {
      display:flex;align-items:center;gap:12px;flex-wrap:wrap;
      padding:16px 20px;background:var(--surface);border:1px solid var(--border);
      border-radius:10px;margin-bottom:16px;
    }
    .mode-btn {
      display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;
      border:1.5px solid var(--border);background:none;cursor:pointer;
      font-size:13px;font-weight:600;font-family:inherit;color:var(--text-muted);
      transition:all .14s;
    }
    .mode-btn.active { background:var(--indigo);border-color:var(--indigo);color:#fff; }
    .mode-btn:not(.active):hover { border-color:var(--indigo-mid);color:var(--indigo); }

    .places-input {
      width:62px;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;
      font-size:14px;font-weight:700;font-family:inherit;text-align:center;
      background:var(--bg);color:var(--text);
    }
    .places-input:focus { outline:none;border-color:var(--indigo); }


    /* ── Carte cooptant (vue Liste) ──────────────────────────────── */
    .cand-card { padding:0; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
    .cand-card:hover { border-color:var(--border-strong); }
    .cand-card.open { border-color:var(--indigo-mid); }
    .cand-head {
      display:flex; align-items:center; gap:16px;
      padding:14px 18px; cursor:pointer;
    }
    .cand-head:focus-visible { outline:2px solid var(--indigo); outline-offset:-2px; border-radius:var(--radius); }
    .cand-id { flex:1; min-width:0; }
    .cand-name { font-weight:600; font-size:15px; color:var(--text); }
    .cand-meta {
      display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px;
      margin-top:3px; font-size:12.5px; color:var(--text-muted); min-width:0;
    }
    .cand-meta-rdv { display:inline-flex; align-items:center; gap:5px; color:var(--indigo-dark); font-weight:500; white-space:nowrap; }
    .cand-meta-mail { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; max-width:100%; }
    .cand-side { display:flex; align-items:center; gap:10px; flex-shrink:0; }
    .cand-score { font-family:var(--font-mono); font-weight:700; font-size:17px; font-variant-numeric:tabular-nums; }
    .cand-score small { font-size:11px; font-weight:600; margin-left:1px; }
    .cand-chevron { display:inline-flex; color:var(--text-muted); transition:transform .2s ease; }
    .cand-card.open .cand-chevron { transform:rotate(180deg); }

    .cand-body { padding:16px 18px 18px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:16px; }
    .cand-body[hidden] { display:none; }
    .cand-body > * { margin-top:0 !important; }
    .cand-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .cand-actions .btn { text-decoration:none; }
    .cand-statut-select { width:auto; min-width:150px; padding-top:7px; padding-bottom:7px; font-size:13px; }
    .cand-del { margin-left:auto; color:var(--red); }
    .cand-del:hover:not(:disabled) { color:var(--red); border-color:var(--red-mid); background:var(--red-light); }

    .cand-infos { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:10px; }
    .cand-info, .cand-reponse { background:var(--bg); border-radius:10px; padding:10px 14px; }
    .cand-info-k { font-size:11.5px; color:var(--text-muted); font-weight:500; }
    .cand-info-v { font-weight:600; font-size:13.5px; margin-top:2px; color:var(--text); }
    .cand-info-v a { color:inherit; }
    .cand-reponse + .cand-reponse { margin-top:6px; }
    .cand-reponse-v { font-size:13.5px; margin-top:3px; color:var(--text); white-space:pre-wrap; overflow-wrap:anywhere; }
    .cand-section-t {
      display:flex; align-items:center; gap:8px;
      font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      color:var(--text-muted); margin-bottom:8px;
    }
    .cand-edit { background:var(--bg); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px; }
    .cand-edit .form-group { margin:0; }
    .cand-edit-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .cand-notes-etat { text-transform:none; letter-spacing:0; font-weight:500; color:var(--green); }
    @media (max-width:640px) {
      .cand-head { flex-wrap:wrap; gap:8px 12px; }
      .cand-side { width:100%; justify-content:flex-start; }
      .cand-chevron { margin-left:auto; }
      .cand-del { margin-left:0; }
    }
    @media (prefers-reduced-motion:reduce) { .cand-chevron { transition:none; } }

    /* ── Decision dots ───────────────────────────────────────────── */
    .decision-dots { display:flex;gap:3px;flex-shrink:0; }
    .decision-dot {
      width:8px;height:8px;border-radius:50%;flex-shrink:0;
      title:attr(title);
    }

    /* ── View toggle pills ───────────────────────────────────────── */
    .view-toggle {
      display:inline-flex;gap:3px;background:var(--bg);padding:3px;
      border-radius:10px;border:1px solid var(--border);
    }
    .view-toggle-btn {
      padding:6px 14px;border-radius:7px;border:none;background:none;
      cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;
      color:var(--text-muted);transition:all .14s;
    }
    .view-toggle-btn.active {
      background:var(--surface);color:var(--indigo);
      box-shadow:0 1px 4px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
<nav class="nav">
  <a href="/secge/dashboard.html" class="nav-brand">
    <div class="nav-brand-icon">C</div>
    <span class="nav-brand-name">Cooptly</span>
  </a>
  <div class="nav-links">
    <a href="/secge/dashboard.html" class="nav-link">Tableau de bord</a>
    <a href="/secge/candidats.html" class="nav-link active">Cooptants</a>
    <a href="/planning.html"        class="nav-link">Planning</a>
    <a href="/parametres.html"      class="nav-link">Paramètres</a>
  </div>
  <div class="nav-right">
    <button class="btn btn-ghost btn-sm" id="btn-logout">Déconnexion</button>
  </div>
</nav>

<main class="page">
  <!-- ── Header ───────────────────────────────────────────────── -->
  <div class="flex-between mb-24" id="candidats-head">
    <div><h1>Cooptants</h1><p>Réponses aux formulaires et gestion des statuts</p></div>
    <div class="flex-gap">
      <select class="form-select" id="campaign-select" style="display:none;width:220px;font-size:14px;"><option value="">Recrutement</option></select>
      <button class="btn btn-secondary" id="btn-export">⬇️ CSV</button>
    </div>
  </div>

  <!-- ── View toggle + Filters ────────────────────────────────── -->
  <div class="card mb-16" style="padding:12px 20px;" id="candidats-controls">
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="btn-view-liste" onclick="setView('liste')">📋 Liste</button>
        <button class="view-toggle-btn" id="btn-view-classement" onclick="setView('classement')">🏆 Classement</button>
        <button class="view-toggle-btn" id="btn-view-evals" onclick="setView('evals')">📊 Évaluations</button>
      </div>
      <input class="form-input" id="search" placeholder="Rechercher…" style="width:180px;font-size:14px;" />
      <select class="form-select" id="filter-statut" style="width:175px;font-size:14px;" aria-label="Filtrer">
        <option value="">Tous les cooptants</option>
        <optgroup label="Statut">
          <option value="recu">Reçus</option>
          <option value="place">Placés</option>
          <option value="entretien_fait">Entretien fait</option>
        </optgroup>
        <optgroup label="Autres">
          <option value="sans-entretien">Sans entretien</option>
          <option value="stand">📍 Inscrits sur un stand</option>

import { requireSecge, logout, resolveOrgContext } from '/js/auth.js';

import { showToast, formatDatetime, confirmDialog, normaliserNote, telephoneCooptant,

import { cooptantEnCorbeille, DUREE_CORBEILLE_JOURS } from '/js/corbeille.js';
import { chargerNotes, migrerNotes, texteNote, enregistrerNote, idNoteCooptant, idNoteEntretien } from '/js/notes.js';

const db = getFirestore(app);

// ─── SÉCURITÉ : échappe les caractères HTML pour éviter les injections XSS ──
// Icônes de la liste : `stroke="currentColor"` suit la couleur du texte.
const SVG_CAL = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
const SVG_CHEVRON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

function esc(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
let user, currentOrg, currentCampaign = null;
let allCandidates = [], customQuestions = [], allEvaluations = [], criteriaConfig = [];
let entretienParCooptant = {};   // candidateId → Date du premier entretien
let ivParCooptant = {};          // candidateId → premier entretien (document), pour la fenêtre dossier
let notesMap = new Map();        // notes internes (privées au bureau), voir js/notes.js
let currentView    = 'liste';   // 'liste' | 'classement'
let currentSortMode = 'manuel';   // 'auto' | 'manuel'
// Manuel par defaut : c'est le mode dans lequel on delibere. Sans ordre
// enregistre, getSortedCandidates() retombe sur le tri par score, donc
// l'affichage initial reste le meme qu'en mode auto.
let rankOrderLocal = [];        // manual order (array of candidateId)

const STATUTS = ['recu','place','entretien_fait'];
const BADGES  = {
  recu:           ['badge-orange', 'Reçu'],
  place:          ['badge-blue', 'Placé'],
  entretien_fait: ['badge-green',  'Entretien fait'],
};

// ─── View / sort mode toggles ────────────────────────────────────

  document.getElementById('btn-view-classement').classList.toggle('active', v === 'classement');
  document.getElementById('btn-view-evals').classList.toggle('active', v === 'evals');
  document.getElementById('list-view').style.display       = v === 'liste'       ? '' : 'none';
  document.getElementById('classement-view').style.display = v === 'classement'  ? '' : 'none';
  document.getElementById('evals-view').style.display      = v === 'evals'       ? '' : 'none';
  if (v === 'classement') renderRanking();

};

window.setSortMode = function(m) {
  currentSortMode = m;
  document.getElementById('btn-sort-auto').classList.toggle('active', m === 'auto');
  document.getElementById('btn-sort-manuel').classList.toggle('active', m === 'manuel');

// ─── Init ────────────────────────────────────────────────────────
async function init() {
  user = await requireSecge();
  // Le menu se construit EN PARALLÈLE des données : l'attendre retardait
  // tout l'affichage de la page, alors qu'il n'en conditionne rien.
  initBurgerMenu(user).catch(e => console.warn('Menu non construit :', e));
  document.getElementById('btn-logout').addEventListener('click', async () => { await logout(); location.href = '/index.html'; });

  const orgId = await resolveOrgContext(user);
  if (!orgId) return;

  const [oDoc, campSnap] = await Promise.all([
    getDoc(doc(db, 'organizations', orgId)),
    getDocs(query(collection(db, 'campaigns'), where('organizationId', '==', orgId)))
  ]);
  currentOrg = { id: orgId, ...(oDoc.exists() ? oDoc.data() : {}) };

  const camps = campSnap.docs
    .map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.createdAt?.toMillis?.() ?? 0) - (a.createdAt?.toMillis?.() ?? 0));

  // Espace de recrutement unique : sélecteur masqué
  const sel = document.getElementById('campaign-select');
  if (sel) sel.style.display = 'none';
  if (camps.length) { await loadCampaign(camps[0]); }

  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('filter-statut').addEventListener('change', applyFilters);
  // Tri de la liste, mémorisé pour la prochaine visite.
  const triSel = document.getElementById('tri-liste');
  try { const t = localStorage.getItem('_triCooptants'); if (t && triSel.querySelector(`option[value="${t}"]`)) triSel.value = t; } catch { /* navigation privée */ }
  triSel.addEventListener('change', () => {
    try { localStorage.setItem('_triCooptants', triSel.value); } catch { /* navigation privée */ }
    applyFilters();
  });
  document.getElementById('btn-export').addEventListener('click', exportCSV);

  document.getElementById('nb-places-input').addEventListener('change', async e => {
    const n = parseInt(e.target.value) || 0;
    if (currentCampaign) {
      await updateDoc(doc(db, 'campaigns', currentCampaign.id), { nbPlaces: n });
      currentCampaign.nbPlaces = n;
    }
    if (currentView === 'classement') renderRanking();
    updateDelibCounts();
  });

  document.getElementById('btn-reset-order').addEventListener('click', async () => {
    rankOrderLocal = [];
    if (currentCampaign) await updateDoc(doc(db, 'campaigns', currentCampaign.id), { rankOrder: [] });
    document.getElementById('btn-reset-order').style.display = 'none';
    renderRanking();
    updateDelibCounts();
  });

  document.getElementById('btn-delib').addEventListener('click', enterDelibMode);
  document.getElementById('btn-delib-exit').addEventListener('click', exitDelibMode);
}

// ─── Load campaign data ───────────────────────────────────────────
async function loadCampaign(campaign) {
  currentCampaign  = campaign;
  criteriaConfig   = campaign.interviewCriteria || [];
  rankOrderLocal   = campaign.rankOrder || [];
  customQuestions  = campaign.formConfig?.customQuestions || [];

  document.getElementById('loading-state').style.display = '';
  document.getElementById('list-view').style.display       = 'none';
  document.getElementById('classement-view').style.display = 'none';
  document.getElementById('empty-state').style.display     = 'none';

  // Restore places count
  document.getElementById('nb-places-input').value = campaign.nbPlaces || 0;
  document.getElementById('btn-reset-order').style.display = (currentSortMode === 'manuel' && rankOrderLocal.length) ? '' : 'none';

  // Parallel: candidates + evaluations
  //
  // Les évaluations DOIVENT être filtrées par asso. Firestore refuse une
  // requête s'il ne peut pas prouver, à partir de ses seuls filtres, que
  // chaque résultat serait lisible ; or la règle de lecture dépend de
  // `organizationId`. Filtrée par campagne seulement, la requête était
  // refusée à tout membre du bureau qui n'est pas admin : la page Cooptants
  // ne s'ouvrait plus du tout pour eux. L'admin passait, d'où l'angle mort.
  const [candSnap, evalSnap, ivSnap, notes] = await Promise.all([
    getDocs(query(collection(db, 'candidates'), where('campaignId', '==', campaign.id))),
    getDocs(query(collection(db, 'interview_evaluations'),
      where('organizationId', '==', campaign.organizationId),
      where('campaignId', '==', campaign.id))),
    // Pour afficher la date d'entretien directement dans la liste.
    getDocs(query(collection(db, 'interviews'), where('campaignId', '==', campaign.id))),
    chargerNotes(db, campaign.organizationId, campaign.id).catch(e => { console.warn('Notes internes illisibles :', e); return new Map(); }),
  ]);
  notesMap = notes;

  entretienParCooptant = {};
  ivParCooptant = {};
  ivSnap.docs.forEach(d => {
    const iv = d.data();
    const t = iv.datetimeStart?.toDate?.();
    if (!iv.candidateId || !t) return;
    const deja = entretienParCooptant[iv.candidateId];
    if (!deja || t < deja) { entretienParCooptant[iv.candidateId] = t; ivParCooptant[iv.candidateId] = iv; }
  });

  allCandidates  = candSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (a.createdAt?.toMillis?.() ?? 0) - (b.createdAt?.toMillis?.() ?? 0));
  allEvaluations = evalSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Anciennes notes posées sur le cooptant (lisibles sans compte) : déplacées
  // une fois pour toutes dans les notes privées du bureau.
  try {
    await migrerNotes(db, notesMap, {
      organizationId: campaign.organizationId, campaignId: campaign.id,
      cooptants: allCandidates,
      entretiens: ivSnap.docs.map(d => ({ id: d.id, ...d.data() })),
    });
  } catch (e) { console.warn('Déplacement des notes internes impossible :', e); }
  allCandidates.forEach(c => { delete c.notesInternes; c._note = texteNote(notesMap, idNoteCooptant(c.id)); });

  computeAllScores();

  const withScore = allCandidates.filter(c => c._score !== null).length;
  document.getElementById('score-status').textContent =
    withScore ? `${withScore} cooptant${withScore > 1 ? 's' : ''} évalué${withScore > 1 ? 's' : ''}` : '';

  document.getElementById('loading-state').style.display = 'none';

  if (currentView === 'classement') {
    document.getElementById('classement-view').style.display = '';
    renderRanking();
  } else {
    renderList(allCandidates);
  }

  // Lien direct vers un dossier (ligne cliquée sur le tableau de bord).
  // Le paramètre est retiré ensuite : recharger la page ne le rouvre pas.
  const dossierDemande = paramLien('dossier');
  if (dossierDemande) {
    openDossier(dossierDemande);
    const url = new URL(location.href);
    url.searchParams.delete('dossier');
    history.replaceState(null, '', url);
  }
}

// ─── Score computation ───────────────────────────────────────────
function computeAllScores() {
  const evalsByCandidate = {};
  allEvaluations.forEach(ev => {
    if (!evalsByCandidate[ev.candidateId]) evalsByCandidate[ev.candidateId] = [];
    evalsByCandidate[ev.candidateId].push(ev);
  });

  // Liste blanche explicite : seuls ces types sont chiffrés et entrent dans le
  // score. Un nouveau type de critère est hors score par défaut : il faut
  // l'ajouter ici sciemment, plutôt que de compter sur l'absence de `max`.
  const SCORED_TYPES = ['echelle', 'note'];

  const numericCriteria = criteriaConfig.filter(cr => SCORED_TYPES.includes(cr.type) && cr.max > 0);

  allCandidates.forEach(c => {
    const evals = evalsByCandidate[c.id] || [];
    c._nbEvals        = evals.length;
    c._criteriaAvgs   = {};
    c._score          = null;
    c._noteGlobaleAvg = null;
    c._comments       = [];
    c._decisions      = { reserve: 0 };

    if (!evals.length) return;

    // Decisions & comments
    evals.forEach(ev => {
      if (ev.decision === 'reserve') c._decisions.reserve = (c._decisions.reserve || 0) + 1;
      if (ev.commentaire) c._comments.push({ text: ev.commentaire });
    });

    // Per-criterion average (normalized 0-100)
    numericCriteria.forEach(cr => {
      const vals = evals
        .map(e => e.criteria?.[cr.id])
        .filter(v => v != null && typeof v === 'number');
      if (vals.length) {
        const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
        c._criteriaAvgs[cr.id] = {
          avg, max: cr.max, label: cr.label,
          normalized: normaliserNote(avg, cr),
        };
      }
    });
    // Couverture : sur combien de critères ce cooptant a-t-il été noté ?
    c._nbCriteresNotes = Object.keys(c._criteriaAvgs).length;
    c._nbCriteresTotal = numericCriteria.length;
    c._partiel = c._nbCriteresTotal > 0 && c._nbCriteresNotes < c._nbCriteresTotal;

    // Collect text criteria responses for display
    const textCriteria = criteriaConfig.filter(cr => cr.type === 'texte');
    c._textAnswers = [];
    textCriteria.forEach(cr => {
      const vals = evals.map(e => e.criteria?.[cr.id]).filter(v => v);
      if (vals.length) c._textAnswers.push({ id: cr.id, label: cr.label, values: vals });
    });

    // Score global = moyenne des critères, en %.
    //
    // Pas de score tant que la grille n'est pas remplie en entier : une moyenne
    // sur un seul critère à 90 % passait devant une moyenne sur cinq à 70 %,
    // alors qu'elle repose sur bien moins de matière. Mieux vaut ne rien
    // afficher qu'un chiffre qu'on ne peut pas comparer. Le badge
    // « 2/5 critères » dit pourquoi la case est vide.
    const normalized = Object.values(c._criteriaAvgs).map(s => s.normalized);
    if (normalized.length && !c._partiel) {
      c._score = Math.round(normalized.reduce((a, b) => a + b, 0) / normalized.length);
    }

    // noteGlobale average
    const notes = evals.map(e => e.noteGlobale).filter(v => v != null && typeof v === 'number');
    if (notes.length) {
      c._noteGlobaleAvg = Math.round((notes.reduce((a, b) => a + b, 0) / notes.length) * 10) / 10;
    }

    // Yesno criteria: collect oui/non counts
    const yesnoCriteria = criteriaConfig.filter(cr => cr.type === 'yesno');
    c._yesnoAnswers = [];
    yesnoCriteria.forEach(cr => {
      const vals = evals.map(e => e.criteria?.[cr.id]).filter(v => v);
      if (vals.length) {
        const oui = vals.filter(v => v === 'oui').length;
        c._yesnoAnswers.push({ id: cr.id, label: cr.label, oui, non: vals.length - oui, total: vals.length });
      }
    });

    // Case à cocher simple : combien de jurés l'ont cochée. Une case non
    // cochée vaut « non renseigné », donc on compare au nombre d'évaluations.
    criteriaConfig.filter(cr => cr.type === 'check').forEach(cr => {
      const coches = evals.filter(e => e.criteria?.[cr.id] === true).length;
      if (coches > 0) {
        c._yesnoAnswers.push({ id: cr.id, label: cr.label, oui: coches, non: 0, total: evals.length });
      }
    });

    // Choix unique / cases à cocher : on compte combien de jurés ont retenu
    // chaque option. Non chiffré, donc hors score : c'est une distribution.
    const choiceCriteria = criteriaConfig.filter(cr => cr.type === 'select' || cr.type === 'multi');
    c._choiceAnswers = [];
    choiceCriteria.forEach(cr => {
      const counts = {};
      let nbRepondants = 0;
      evals.forEach(e => {
        const v = e.criteria?.[cr.id];
        if (v == null) return;
        // 'select' stocke une chaîne, 'multi' un tableau
        const picked = Array.isArray(v) ? v : [v];
        if (!picked.length) return;
        nbRepondants++;
        picked.forEach(opt => { counts[opt] = (counts[opt] || 0) + 1; });
      });
      if (nbRepondants) {
        // Options dans l'ordre configuré, puis les valeurs orphelines
        // (option renommée ou supprimée après une évaluation).
        const ordered = [
          ...(cr.options || []).filter(o => counts[o]),
          ...Object.keys(counts).filter(o => !(cr.options || []).includes(o)),
        ];
        c._choiceAnswers.push({
          id: cr.id,
          label: cr.label,
          multi: cr.type === 'multi',
          total: nbRepondants,
          items: ordered.map(o => ({ option: o, n: counts[o] })),
        });
      }
    });
  });
}

// ─── Vue Évaluations ─────────────────────────────────────────────
function renderEvalsView() {
  const el = document.getElementById('evals-list');
  if (!currentCampaign) { el.innerHTML = '<p class="text-muted text-sm">Chargement…</p>'; return; }
  if (!allCandidates.length) { el.innerHTML = '<p class="text-muted text-sm">Aucun cooptant.</p>'; return; }

  // Sort: 0 évals first, then by count desc
  const sorted = [...allCandidates].sort((a, b) => a._nbEvals - b._nbEvals);

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
      <span class="text-sm text-muted">${sorted.length} cooptant${sorted.length > 1 ? 's' : ''}</span>
      <span class="text-sm text-muted">${sorted.filter(c => c._nbEvals > 0).length} évalué${sorted.filter(c => c._nbEvals > 0).length > 1 ? 's' : ''} · ${sorted.filter(c => c._nbEvals === 0).length} sans évaluation</span>
    </div>`;

  sorted.forEach(c => {
    const n      = c._nbEvals;
    const done   = n > 0;
    const color  = done ? 'var(--green)' : 'var(--red)';
    const bg     = done ? 'var(--green-light)' : 'var(--red-light)';
    const border = done ? 'var(--green-mid)' : 'var(--red-mid)';
    const initials = `${(c.prenom||'?')[0]}${(c.nom||'?')[0]}`.toUpperCase();
    const name     = esc(`${c.prenom || ''} ${c.nom || ''}`.trim());
    const label    = n === 0 ? 'Pas encore évalué' : `${n} évaluation${n > 1 ? 's' : ''}`;

    const row = document.createElement('div');
    row.style.cssText = `display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:10px;border:1.5px solid ${border};background:${bg};`;
    row.innerHTML = `
      <div style="width:38px;height:38px;border-radius:9px;background:var(--indigo-light);color:var(--indigo);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${initials}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:14px;">${name}</div>
        <div style="font-size:12px;font-weight:600;color:${color};margin-top:3px;">${label}</div>
      </div>
      <a href="/secge/evaluer.html?candidateId=${c.id}&campaignId=${currentCampaign.id}"
         class="btn btn-ghost btn-sm" style="text-decoration:none;white-space:nowrap;">
        ${done ? '🔍 Voir / Ajouter' : '✏️ Évaluer'}
      </a>`;
    el.appendChild(row);
  });
}

// ─── Helpers ─────────────────────────────────────────────────────
function scoreColor(pct) {
  if (pct === null) return 'var(--text-light)';
  if (pct >= 70)    return 'var(--green)';
  if (pct >= 45)    return 'var(--orange)';
  return 'var(--red)';
}

function scoreRingSVG(pct, size = 50) {
  const r = size / 2 - 5;
  const circ = 2 * Math.PI * r;
  const offset = pct === null ? circ : circ * (1 - pct / 100);
  const color  = scoreColor(pct);
  const label  = pct === null ? '·' : pct;
  const fs     = size <= 50 ? 11 : 14;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex-shrink:0;">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="3.5"/>
    ${pct !== null ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${color}" stroke-width="3.5"
      stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
      stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/>` : ''}
    <text x="${size/2}" y="${size/2 + fs*0.38}" text-anchor="middle"
      font-size="${fs}" font-weight="800" style="fill:${color}"
      font-family="Montserrat,Helvetica Neue,Arial,sans-serif">${label}</text>
  </svg>`;
}

// ─── LIST VIEW ───────────────────────────────────────────────────
/**
 * Supprime définitivement une candidature, son entretien et son évaluation.
 *
 * Les trois documents sont liés par `candidateId` : ne retirer que la
 * candidature laisserait un entretien fantôme sur le planning et une évaluation
 * orpheline dans les stats.
 *
 * @param {object} c    cooptant
 * @param {HTMLElement} card carte à retirer de la liste en cas de succès
 */
async function supprimerCandidat(c, card) {
  const nom = `${c.prenom || ''} ${c.nom || ''}`.trim() || c.email;
  const ok = await confirmDialog(
    `Supprimer la candidature de ${nom} ? `
    + `Son entretien et son évaluation partent avec. Tout reste récupérable ${DUREE_CORBEILLE_JOURS} jours dans Paramètres, onglet Corbeille.`,
    { title: 'Supprimer la candidature', confirmLabel: 'Supprimer', danger: true }
  );
  if (!ok) return;

  try {
    const orgId = c.organizationId || currentOrg?.id;
    const [candDoc, ivSnap, evalSnap] = await Promise.all([
      // Relu plutôt que pris dans la liste : la copie de la corbeille doit être
      // le document tel qu'il est en base, sans les champs calculés par la page.
      getDoc(doc(db, 'candidates', c.id)),
      getDocs(query(collection(db, 'interviews'),            where('candidateId', '==', c.id))),
      // Filtre par asso indispensable, voir le chargement des évaluations.
      getDocs(query(collection(db, 'interview_evaluations'),
        where('organizationId', '==', orgId),
        where('candidateId', '==', c.id))),
    ]);
    // Copie en corbeille et suppressions partent dans le même lot.
    // Ses notes internes (sur lui et sur ses entretiens) partent avec lui.
    const sesNotes = [idNoteCooptant(c.id), ...ivSnap.docs.map(d => idNoteEntretien(d.id))]
      .map(id => notesMap.get(id)).filter(Boolean);
    await cooptantEnCorbeille(db,
      { id: c.id, ...(candDoc.exists() ? candDoc.data() : c) },
      ivSnap.docs, evalSnap.docs, orgId, user?.email || null, sesNotes);
    sesNotes.forEach(n => notesMap.delete(n.id));

    allCandidates = allCandidates.filter(x => x.id !== c.id);
    card.remove();
    applyFilters();
    showToast(`Candidature de ${esc(nom)} mise à la corbeille (Paramètres › Corbeille).`, 'success');
  } catch (err) {
    showToast('Erreur : ' + err.message, 'error');
  }
}

          const chip = document.createElement('span'); chip.style.cssText = 'font-size:11px;font-weight:600;padding:2px 8px;background:var(--indigo-light);color:var(--indigo);border-radius:99px;'; chip.textContent = h;
          row.appendChild(chip);
        });
        dysGrid.appendChild(row);

      dDiv.appendChild(dysGrid); body.appendChild(dDiv);
    }

    // ── Notes internes : enregistrées en quittant le champ ────────
    const notesDiv = document.createElement('div');
    notesDiv.className = 'cand-notes';
    notesDiv.innerHTML = `<label class="cand-section-t" for="notes-${c.id}">Notes internes <span class="cand-notes-etat" aria-live="polite"></span></label>
      <textarea class="form-textarea" id="notes-${c.id}" rows="2" placeholder="Visible uniquement par le bureau">${esc(c._note || '')}</textarea>`;
    body.appendChild(notesDiv);
    const notesArea = notesDiv.querySelector('textarea');
    const notesEtat = notesDiv.querySelector('.cand-notes-etat');
    notesArea.addEventListener('blur', async () => {
      const v = notesArea.value;
      if (v === (c._note || '')) return;
      notesEtat.textContent = 'Enregistrement…';
      try {
        await enregistrerNote(db, notesMap, idNoteCooptant(c.id),
          { organizationId: c.organizationId || currentOrg?.id, campaignId: currentCampaign?.id, candidateId: c.id }, v);
        c._note = v;

      } catch (err) {
        notesEtat.textContent = '';
        showToast('Notes non enregistrées : ' + err.message, 'error');
      }
    });

    // ── Déplier / replier ─────────────────────────────────────────
    const basculer = () => {
      body.hidden = !body.hidden;
      card.classList.toggle('open', !body.hidden);
      header.setAttribute('aria-expanded', String(!body.hidden));
    };
    header.setAttribute('aria-expanded', 'false');
    header.addEventListener('click', basculer);
    header.addEventListener('keydown', e => {
      if (e.target === header && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); basculer(); }
    });

    card.appendChild(header); card.appendChild(body);
    list.appendChild(card);
  });
}

// ─── CLASSEMENT VIEW ─────────────────────────────────────────────
function getSortedCandidates() {
  let sorted;
  if (currentSortMode === 'manuel' && rankOrderLocal.length) {
    const indexMap = {};
    rankOrderLocal.forEach((id, i) => { indexMap[id] = i; });
    sorted = [...allCandidates].sort((a, b) => {
      const ia = indexMap[a.id] ?? 9999;
      const ib = indexMap[b.id] ?? 9999;
      if (ia !== ib) return ia - ib;
      return (b._score ?? -1) - (a._score ?? -1);
    });
  } else {
    // Auto: sort by effective score desc, unevaluated at end
    // _score (criteria %) takes priority; fallback to noteGlobale/20*100 when no numeric criteria
    const eff = c => c._score ?? (c._noteGlobaleAvg !== null ? Math.round(c._noteGlobaleAvg * 5) : null);
    sorted = [...allCandidates].sort((a, b) => {
      const sa = eff(a), sb = eff(b);
      if (sa === null && sb === null) return 0;
      if (sa === null) return 1;
      if (sb === null) return -1;
      return sb - sa;
    });
  }
  return sorted;
}

function renderRanking() {
  const container = document.getElementById('ranking-list');
  container.innerHTML = '';

  if (!allCandidates.length) {
    container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg></div><h3>Aucun cooptant reçu</h3><p>Le classement apparaîtra dès réception des premières candidatures.</p></div>';
    return;
  }

  const sorted = getSortedCandidates();
  const nbPlaces = parseInt(document.getElementById('nb-places-input').value) || 0;
  const isManuel = currentSortMode === 'manuel';

  sorted.forEach((c, idx) => {
    const rank = idx + 1;
    const isAbove = nbPlaces > 0 && rank <= nbPlaces;
    const isBelow = nbPlaces > 0 && rank > nbPlaces;

    // Cutoff divider
    if (nbPlaces > 0 && rank === nbPlaces + 1) {
      const div = document.createElement('div');
      div.className = 'cutoff-divider';
      div.textContent = `↑ ${nbPlaces} place${nbPlaces > 1 ? 's' : ''} retenue${nbPlaces > 1 ? 's' : ''}`;
      container.appendChild(div);
    }

    const [bc, blabel] = BADGES[c.statut] || ['badge-gray', c.statut];
    const row = document.createElement('div');
    row.className = `rank-row${isAbove ? ' above-cut' : isBelow ? ' below-cut' : ''}${isManuel ? ' draggable' : ''}`;
    row.dataset.candId = c.id;

    // Glisser-déposer : en délibération on remonte quelqu'un de 10 rangs d'un
    // seul geste, là où les flèches ↑↓ demanderaient 10 clics.
    if (isManuel) {
      const grip = document.createElement('div');
      grip.className = 'rank-grip';
      grip.textContent = '⋮⋮';
      grip.title = 'Glisser pour déplacer';
      row.appendChild(grip);
      attachDragHandlers(row, c.id);

      // La poignée est le SEUL point de départ du glisser. Si toute la ligne
      // était draggable, impossible de sélectionner le contenu du champ de
      // position : le navigateur démarrerait un drag à la place.
      row.draggable = false;
      grip.addEventListener('mousedown', () => { row.draggable = true; });
      grip.addEventListener('mouseup',   () => { row.draggable = false; });
      row.addEventListener('dragend',    () => { row.draggable = false; });
    }

    // Numero de rang. En manuel c'est un champ : taper la position voulue
    // evite de remonter quelqu'un rang par rang.
    const isTop = rank <= 3 && (c._score !== null || c._noteGlobaleAvg !== null);
    let numEl;
    if (isManuel) {
      numEl = document.createElement('input');
      numEl.type = 'text';
      numEl.inputMode = 'numeric';
      numEl.className = `rank-num rank-num-input${isTop ? ' top' : ''}`;
      numEl.value = rank;
      numEl.title = 'Taper une position, puis Entrée';
      numEl.setAttribute('aria-label', `Position de ${c.prenom || ''} ${c.nom || ''}`.trim());
      attachRankInput(numEl, c.id, rank, sorted.length);
    } else {
      numEl = document.createElement('div');
      numEl.className = `rank-num${isTop ? ' top' : ''}`;
      numEl.textContent = `#${rank}`;
    }

    // Avatar
    const avatarEl = document.createElement('div');
    avatarEl.className = 'rank-avatar';
    avatarEl.textContent = `${(c.prenom || '?')[0]}${(c.nom || '?')[0]}`;

    // Info (name, email, criteria chips)
    const infoEl = document.createElement('div');
    infoEl.className = 'rank-info';
    const critsHtml = Object.values(c._criteriaAvgs).map(cr => {
      const pct = Math.round(cr.normalized);
      return `<span class="rank-crit-chip" title="${esc(cr.label)}: ${cr.avg.toFixed(1)}/${cr.max}">
        <span class="rank-crit-name">${esc(cr.label)}</span>
        <span style="color:${scoreColor(pct)};font-weight:800;">${pct}%</span>
      </span>`;
    }).join('');
    infoEl.innerHTML = `
      <div class="rank-name">${esc(c.prenom)} ${esc(c.nom)}</div>
      <div class="rank-email">${esc(c.email)}</div>
      ${critsHtml ? `<div class="rank-crits">${critsHtml}</div>` : ''}`;

    // Score block
    const scoreEl = document.createElement('div');
    scoreEl.className = 'rank-score-block';
    if (c._score !== null) {
      scoreEl.innerHTML = `${scoreRingSVG(c._score, 44)}
        <div class="rank-score-sub">${c._nbEvals}j${c._noteGlobaleAvg !== null ? ` · ${c._noteGlobaleAvg}/20` : ''}${
          c._partiel ? ` · <span style="color:var(--orange);font-weight:700;" title="Noté sur ${c._nbCriteresNotes} critère(s) sur ${c._nbCriteresTotal}">${c._nbCriteresNotes}/${c._nbCriteresTotal} crit.</span>` : ''
        }</div>`;
    } else if (c._noteGlobaleAvg !== null) {
      scoreEl.innerHTML = `${scoreRingSVG(Math.round(c._noteGlobaleAvg * 5), 44)}
        <div class="rank-score-sub">${c._nbEvals}j · /20</div>`;
    } else {
      scoreEl.innerHTML = `${scoreRingSVG(null, 44)}
        <div class="rank-score-sub">${c._nbEvals > 0 ? `${c._nbEvals} éval.` : '·'}</div>`;
    }

    // Status + decisions
    const statusEl = document.createElement('div');
    statusEl.style.cssText = 'flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px;';
    statusEl.innerHTML = `<span class="badge ${bc}">${blabel}</span>
      ${c._decisions.reserve > 0 ? `<div class="decision-dots" style="justify-content:flex-end;">
        ${Array(c._decisions.reserve).fill('<span class="decision-dot" style="background:var(--orange);" title="À revoir"></span>').join('')}
      </div>` : ''}`;

    // Quick actions
    const actionsEl = document.createElement('div');
    actionsEl.style.cssText = 'flex-shrink:0;display:flex;flex-direction:column;gap:5px;';

    // Dossier : réponses au formulaire et retours du jury, lisibles en délib.
    const dossierBtn = document.createElement('button');
    dossierBtn.className = 'btn btn-ghost btn-sm';
    dossierBtn.textContent = '📄';
    dossierBtn.title = `Dossier de ${c.prenom || ''} ${c.nom || ''}`.trim();
    dossierBtn.setAttribute('aria-label', dossierBtn.title);
    dossierBtn.style.cssText = 'padding:4px 8px;';
    dossierBtn.addEventListener('click', () => openDossier(c.id));
    actionsEl.appendChild(dossierBtn);

    // View/eval link
    const evalLink = document.createElement('button');
    evalLink.className = 'btn btn-ghost btn-sm';
    evalLink.textContent = '🎙';
    evalLink.title = 'Fiche d\'entretien';
    evalLink.style.cssText = 'padding:4px 8px;';
    evalLink.addEventListener('click', () => openEvalPanel(c.id));
    actionsEl.appendChild(evalLink);

    // Move up/down in manuel mode
    if (isManuel) {
      const moveWrap = document.createElement('div');
      moveWrap.className = 'rank-actions';
      const upBtn = document.createElement('button'); upBtn.className = 'rank-move-btn'; upBtn.textContent = '↑'; upBtn.title = 'Monter';
      const dnBtn = document.createElement('button'); dnBtn.className = 'rank-move-btn'; dnBtn.textContent = '↓'; dnBtn.title = 'Descendre';
      if (idx === 0) upBtn.disabled = true;
      if (idx === sorted.length - 1) dnBtn.disabled = true;
      upBtn.addEventListener('click', () => moveCandidate(c.id, sorted, -1));
      dnBtn.addEventListener('click', () => moveCandidate(c.id, sorted, +1));
      moveWrap.appendChild(upBtn); moveWrap.appendChild(dnBtn);
      actionsEl.appendChild(moveWrap);
    }

    // En réunion, on désigne quelqu'un par son nom : cliquer sur le bloc
    // d'infos ouvre son dossier, sans gêner le champ de rang ni la poignée.
    infoEl.style.cursor = 'pointer';
    infoEl.title = 'Voir le dossier';
    infoEl.addEventListener('click', () => openDossier(c.id));

    row.appendChild(numEl);
    row.appendChild(avatarEl);
    row.appendChild(infoEl);
    row.appendChild(scoreEl);
    row.appendChild(statusEl);
    row.appendChild(actionsEl);
    container.appendChild(row);
  });

  refreshDossierPosition();
}

/**
 * Remet à jour le « 4/46 » et les flèches du dossier après un réordonnancement.
 * On ne re-rend pas le corps : on perdrait le défilement en pleine lecture.
 */
function refreshDossierPosition() {
  if (!dossierCandId) return;
  const sorted = getSortedCandidates();
  const idx    = sorted.findIndex(x => x.id === dossierCandId);
  document.getElementById('dossier-pos').textContent =
    idx >= 0 ? `${idx + 1}/${sorted.length}` : '';
  document.getElementById('dossier-prev').disabled = idx <= 0;
  document.getElementById('dossier-next').disabled = idx < 0 || idx >= sorted.length - 1;
}

// ─── Panneau dossier ─────────────────────────────────────────────
// En délibération, le classement n'affiche que nom, score et critères. Or
// c'est précisément le moment où l'on veut relire une motivation ou un
// commentaire de jury. Ce panneau les rend consultables sans quitter la
// vue ni perdre l'ordre en cours de réordonnancement.

let dossierCandId = null;

/**
 * Ouvre (ou recharge) le dossier d'un cooptant.
 * @param {string} candId
 */
function openDossier(candId) {
  const c = allCandidates.find(x => x.id === candId);
  if (!c) return;
  dossierCandId = candId;

  const sorted = getSortedCandidates();
  const idx    = sorted.findIndex(x => x.id === candId);

  const nom = `${c.prenom || ''} ${c.nom || ''}`.trim() || c.email || 'Cooptant';
  document.getElementById('dossier-name').textContent = nom;

  const [bc, blabel] = BADGES[c.statut] || ['badge-gray', c.statut];
  const score = c._score !== null ? `${c._score} %`
              : (c._noteGlobaleAvg !== null ? `${c._noteGlobaleAvg}/20`
              : (c._partiel ? 'évaluation incomplète' : 'pas encore évalué'));
  const couverture = c._partiel
    ? ` · <span style="color:var(--orange);font-weight:700;">${c._nbCriteresNotes}/${c._nbCriteresTotal} critères notés</span>`
    : '';
  document.getElementById('dossier-meta').innerHTML =
    `<span class="badge ${bc}" style="font-size:10px;">${blabel}</span>`
    + `<span>${esc(score)}</span>${couverture}`;

  document.getElementById('dossier-pos').textContent =
    idx >= 0 ? `${idx + 1}/${sorted.length}` : '';
  document.getElementById('dossier-prev').disabled = idx <= 0;
  document.getElementById('dossier-next').disabled = idx < 0 || idx >= sorted.length - 1;

  enregistrerNoteDossier();   // note du cooptant précédent (flèches ↑/↓)
  document.getElementById('dossier-body').innerHTML = dossierHtml(c);
  const zoneNote = document.getElementById('dossier-note');
  zoneNote.dataset.cand = c.id;
  zoneNote.addEventListener('blur', enregistrerNoteDossier);

  document.body.classList.add('dossier-on');
  document.getElementById('dossier-panel').classList.add('open');
  remplirSalleEtJury(c.id);
}

const tuile = (k, v) => `<div class="cp-tile"><div class="cp-k">${k}</div><div class="cp-v">${v}</div></div>`;

/** Tuiles du haut : contact et entretien (salle et jury complétés ensuite). */
function tuilesDossier(c, tel) {
  const iv = ivParCooptant[c.id];
  // ✏️ : ouvre l'allocation de ce cooptant dans le planning, pour (re)caler son créneau.
  const crayon = libelle => `<a class="cp-crayon" href="/planning.html?org=${encodeURIComponent(currentOrg?.id || '')}&allouer=${encodeURIComponent(c.id)}" title="${libelle}" aria-label="${libelle}">✏️</a>`;
  const t = [];
  if (c.email) t.push(tuile('Email', `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>`));
  if (tel)     t.push(tuile('Téléphone', `<a href="tel:${esc(tel.replace(/\s+/g, ''))}">${esc(tel)}</a>`));
  if (!iv) {
    t.push(tuile('Entretien', `Pas encore planifié ${crayon('Placer ce cooptant dans le planning')}`));
    return `<div class="cp-grid">${t.join('')}</div>`;
  }
  const s = iv.datetimeStart.toDate();
  const e = iv.datetimeEnd?.toDate?.();
  const hm = d => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const date = s.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  t.push(tuile('Entretien', `${esc(date)}, ${hm(s)}${e ? ' - ' + hm(e) : ''} ${crayon('Changer le créneau')}`));
  t.push(tuile('Salle', '<span id="dossier-salle" class="text-muted">…</span>'));
  t.push(tuile('Jury', '<span id="dossier-jury" class="text-muted">…</span>'));
  return `<div class="cp-grid">${t.join('')}</div>`;
}

/**
 * Noms des jurés, lus là où ils sont lisibles : liste du staff, puis dispos
 * déposées (un compte sans entrée dans la liste n'y a parfois que sa fiche de
 * dispos). Mémorisés : la même personne revient sur des dizaines de cartes.
 */
const cacheNomsJures = new Map();
function nomJure(id) {
  if (!cacheNomsJures.has(id)) {
    cacheNomsJures.set(id, (async () => {
      try {
        const r = await getDoc(doc(db, 'roster_members', id));
        if (r.exists() && r.data().displayName) return r.data().displayName;
        const sa = await getDocs(query(collection(db, 'staff_availabilities'), where('userId', '==', id)));
        return sa.docs.map(d => d.data().displayName).find(Boolean) || null;
      } catch { return null; }
    })());
  }
  return cacheNomsJures.get(id);
}
const nomsJures = ids => Promise.all(ids.map(nomJure));

/** Noms de la salle et des jurés, lus là où ils sont lisibles (comme au tableau de bord). */
async function remplirSalleEtJury(candId) {
  const iv = ivParCooptant[candId];
  if (!iv) return;
  const juryIds = [iv.jury1Id, iv.jury2Id, iv.jury3Id].filter(Boolean);
  const [salle, jures] = await Promise.all([
    iv.roomId
      ? getDoc(doc(db, 'rooms', iv.roomId)).then(r => r.exists() ? (r.data().code || r.data().nom || r.data().name) : iv.salleNom).catch(() => iv.salleNom)
      : Promise.resolve(iv.salleNom || ''),
    nomsJures(juryIds),
  ]);
  if (dossierCandId !== candId) return;
  const zS = document.getElementById('dossier-salle');
  const zJ = document.getElementById('dossier-jury');
  if (zS) { zS.className = ''; zS.innerHTML = salle ? esc(salle) : '<span style="color:var(--orange);">À définir</span>'; }
  if (zJ) { zJ.className = ''; zJ.innerHTML = juryIds.length ? esc(jures.map(n => n || 'Membre du jury').join(', ')) : '<span style="color:var(--red);">À définir</span>'; }
}

function closeDossier() {
  enregistrerNoteDossier();
  dossierCandId = null;
  document.body.classList.remove('dossier-on');
  document.getElementById('dossier-panel').classList.remove('open');
}

/** Passe au cooptant suivant (+1) ou précédent (-1) dans l'ordre affiché. */
function dossierStep(delta) {
  if (!dossierCandId) return;
  const sorted = getSortedCandidates();
  const idx    = sorted.findIndex(x => x.id === dossierCandId);
  const next   = sorted[idx + delta];
  if (next) openDossier(next.id);
}

/** Contenu du dossier : réponses au formulaire, puis retours du jury. */
function dossierHtml(c) {
  const tel = telephoneCooptant(c, customQuestions);
  let html = tuilesDossier(c, tel);

  // Réponses au formulaire de cooptation (vides et téléphone, déjà en tuile, masqués)
  const reponses = reponsesOrdonnees(c).filter(({ value }) => {
    const v = String(value ?? '').trim();
    return v !== '' && v !== tel;
  });
  html += '<div class="dossier-section-title" style="margin-top:16px;">Réponses au formulaire</div>';
  if (!reponses.length) {
    html += '<div class="dossier-empty">Ce cooptant n\'a répondu à aucune question personnalisée.</div>';
  } else {
    reponses.forEach(({ label, value }) => {
      html += `<div class="dossier-qa">
        <div class="dossier-label">${esc(label)}</div>
        <div class="dossier-value">${esc(value) || '<span class="text-muted">Sans réponse</span>'}</div>
      </div>`;
    });
  }

  // Réponses libres des jurys aux critères de type texte
  if (c._textAnswers?.length) {
    html += '<div class="dossier-section-title">Réponses libres du jury</div>';
    c._textAnswers.forEach(t => {
      html += `<div class="dossier-qa"><div class="dossier-label">${esc(t.label)}</div>`;
      t.values.forEach(v => { html += `<div class="dossier-value" style="margin-top:6px;">${esc(v)}</div>`; });
      html += '</div>';
    });
  }

  // Commentaires généraux des jurys
  if (c._comments?.length) {
    html += '<div class="dossier-section-title">Commentaires du jury</div>';
    c._comments.forEach(cm => { html += `<div class="dossier-quote">${esc(cm.text)}</div>`; });
  }

  if (!c._textAnswers?.length && !c._comments?.length) {
    html += '<div class="dossier-section-title">Retours du jury</div>'
          + `<div class="dossier-empty">${c._nbEvals > 0
              ? 'Les jurys ont noté sans laisser de commentaire.'
              : 'Aucune évaluation reçue pour le moment.'}</div>`;
  }

  // Note interne, la même que dans la carte du cooptant
  html += `<label class="dossier-section-title" for="dossier-note" style="display:block;">Note interne <span id="dossier-note-etat" style="text-transform:none;letter-spacing:0;font-weight:500;" aria-live="polite"></span></label>
    <textarea class="form-textarea" id="dossier-note" rows="3" placeholder="Visible uniquement par le bureau">${esc(c._note || '')}</textarea>`;

  return html;
}

/** Enregistre la note du dossier ouvert si elle a changé. */
async function enregistrerNoteDossier() {
  const zone = document.getElementById('dossier-note');
  const c = allCandidates.find(x => x.id === zone?.dataset.cand);
  if (!zone || !c || zone.value === (c._note || '')) return;
  const v = zone.value;
  const etat = document.getElementById('dossier-note-etat');
  if (etat) etat.textContent = '· Enregistrement…';
  try {
    await enregistrerNote(db, notesMap, idNoteCooptant(c.id),
      { organizationId: c.organizationId || currentOrg?.id, campaignId: currentCampaign?.id, candidateId: c.id }, v);
    c._note = v;
    if (etat?.isConnected) etat.textContent = '· Enregistré';
    const carte = document.getElementById(`notes-${c.id}`);
    if (carte && document.activeElement !== carte) carte.value = v;
  } catch (err) {
    console.error(err);
    if (etat?.isConnected) etat.textContent = '';
    showToast('Note non enregistrée : réessaie.', 'error');
  }
}

document.getElementById('dossier-close').addEventListener('click', closeDossier);
document.getElementById('dossier-overlay').addEventListener('click', closeDossier);
document.getElementById('dossier-prev').addEventListener('click', () => dossierStep(-1));
document.getElementById('dossier-next').addEventListener('click', () => dossierStep(+1));

document.addEventListener('keydown', e => {
  if (!dossierCandId) return;

  // Échap : en délibération l'écran est en plein écran natif, et aucun script ne
  // peut empêcher Échap d'en sortir. Lui faire aussi fermer le dossier ferait
  // donc quitter la délibération d'une seule touche. Hors plein écran, elle
  // ferme le dossier comme partout ailleurs ; en plein écran, `fullscreenchange`
  // s'en charge en sortant.
  if (e.key === 'Escape') {
    if (!document.fullscreenElement) closeDossier();
    return;
  }

  // Ne pas voler les flèches à la saisie du rang.
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  if (e.key === 'ArrowUp'   || e.key === 'ArrowLeft')  { e.preventDefault(); dossierStep(-1); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); dossierStep(+1); }
});

// ─── Mode délibération ───────────────────────────────────────────
// Plein écran de réunion : on masque le chrome, on agrandit les lignes et on
// affiche en permanence le décompte retenus / places. L'ordre reste le même
// objet `rankOrder` : c'est la même donnée, juste présentée pour un groupe.

function updateDelibCounts() {
  if (!document.body.classList.contains('delib-on')) return;
  const total    = allCandidates.length;
  const nbPlaces = parseInt(document.getElementById('nb-places-input').value) || 0;
  const retenus  = nbPlaces > 0 ? Math.min(nbPlaces, total) : total;
  const evalues  = allCandidates.filter(c => c._nbEvals > 0).length;

  const cell = (val, lbl) =>
    `<div><div class="delib-count-val">${val}</div><div class="delib-count-lbl">${lbl}</div></div>`;
  document.getElementById('delib-counts').innerHTML =
    cell(retenus, 'retenus') + cell(total, 'cooptants') + cell(`${evalues}/${total}`, 'évalués');

  document.getElementById('delib-sub').textContent = nbPlaces > 0
    ? `${nbPlaces} place${nbPlaces > 1 ? 's' : ''}, glisse les lignes pour réordonner`
    : 'Aucune limite de places, glisse les lignes pour réordonner';
}

async function enterDelibMode() {
  // Délibérer, c'est décider d'un ordre : le mode manuel est le seul qui le permette.
  if (currentSortMode !== 'manuel') setSortMode('manuel');
  document.body.classList.add('delib-on');
  renderRanking();
  updateDelibCounts();
  try { await document.documentElement.requestFullscreen(); }
  catch { /* refus ou non supporté : le mode reste utilisable sans plein écran */ }
}

async function exitDelibMode() {
  closeDossier();
  document.body.classList.remove('delib-on');
  renderRanking();
  if (document.fullscreenElement) {
    try { await document.exitFullscreen(); } catch { /* ignore */ }
  }
}

// Sortie via Échap ou le bouton natif du navigateur : garder le CSS synchronisé.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && document.body.classList.contains('delib-on')) {
    closeDossier();
    document.body.classList.remove('delib-on');
    renderRanking();
  }
});

// ─── Glisser-déposer du classement ───────────────────────────────
let _dragCandId = null;

function clearDropMarks() {
  document.querySelectorAll('.rank-row.drop-above, .rank-row.drop-below')
    .forEach(r => r.classList.remove('drop-above', 'drop-below'));
}

function attachDragHandlers(row, candId) {
  row.addEventListener('dragstart', e => {
    _dragCandId = candId;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox exige des données pour déclencher le drag
    e.dataTransfer.setData('text/plain', candId);
  });

  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    clearDropMarks();
    _dragCandId = null;
  });

  row.addEventListener('dragover', e => {
    if (!_dragCandId || _dragCandId === candId) return;
    e.preventDefault();                       // autorise le drop
    e.dataTransfer.dropEffect = 'move';
    // Au-dessus ou en dessous, selon la moitié de ligne survolée
    const r = row.getBoundingClientRect();
    const before = (e.clientY - r.top) < r.height / 2;
    row.classList.toggle('drop-above', before);
    row.classList.toggle('drop-below', !before);
  });

  row.addEventListener('dragleave', () => row.classList.remove('drop-above', 'drop-below'));

  row.addEventListener('drop', async e => {
    e.preventDefault();
    const dragged = _dragCandId;
    const before  = row.classList.contains('drop-above');
    clearDropMarks();
    if (!dragged || dragged === candId) return;
    await reorderCandidate(dragged, candId, before);
  });
}

/**
 * Champ de position : taper un rang et valider deplace le cooptant a cet
 * endroit. Entree valide, Echap annule, et sortir du champ valide aussi
 * (on tape souvent un chiffre puis on clique ailleurs).
 */
function attachRankInput(input, candId, currentRank, total) {
  let annule = false;

  const valider = async () => {
    if (annule) return;
    const val = parseInt(input.value, 10);

    // Saisie vide ou non numerique : on remet la valeur affichee.
    if (isNaN(val)) { input.value = currentRank; return; }

    // Bornes : 1 = premier, total = dernier. On clampe plutot que de refuser,
    // « 99 » veut clairement dire « tout en bas ».
    const cible = Math.min(Math.max(val, 1), total);
    if (cible === currentRank) { input.value = currentRank; return; }

    await moveCandidateToPosition(candId, cible);
  };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { annule = true; input.value = currentRank; input.blur(); }
  });
  input.addEventListener('blur', valider);
  // Selectionner tout au focus : on remplace le numero, on ne l'edite pas.
  input.addEventListener('focus', () => input.select());
}

/** Place `candId` a la position `pos` (1 = premier) et persiste l'ordre. */
async function moveCandidateToPosition(candId, pos) {
  const ids = getSortedCandidates().map(c => c.id);
  if (!ids.includes(candId)) return;

  const next = ids.filter(id => id !== candId);
  // pos est en base 1 ; apres retrait, l'insertion se fait a pos-1.
  next.splice(Math.min(Math.max(pos - 1, 0), next.length), 0, candId);

  await persistRankOrder(next);

  // Redonner le focus au champ deplace : on enchaine souvent plusieurs
  // repositionnements pendant une deliberation.
  requestAnimationFrame(() => {
    const row = document.querySelector(`.rank-row[data-cand-id="${candId}"]`);
    row?.querySelector('.rank-num-input')?.focus();
  });
}

/** Déplace `draggedId` juste avant/après `targetId` et persiste l'ordre. */
async function reorderCandidate(draggedId, targetId, before) {
  const ids = getSortedCandidates().map(c => c.id);

  // On valide AVANT de muter : retirer puis abandonner sur cible introuvable
  // ferait disparaître le cooptant de la liste.
  if (draggedId === targetId) return;
  if (!ids.includes(draggedId) || !ids.includes(targetId)) return;

  const next = ids.filter(id => id !== draggedId);
  const to   = next.indexOf(targetId);
  next.splice(before ? to : to + 1, 0, draggedId);

  await persistRankOrder(next);
}

// ─── Manual ordering ─────────────────────────────────────────────
async function moveCandidate(candId, currentSorted, direction) {
  // Build/refresh the local order from current sorted view
  const ids = currentSorted.map(c => c.id);
  const idx = ids.indexOf(candId);
  if (idx === -1) return;
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= ids.length) return;

  [ids[idx], ids[newIdx]] = [ids[newIdx], ids[idx]];
  await persistRankOrder(ids);
}

/** Enregistre l'ordre du classement : partagé par les flèches et le drag&drop. */
async function persistRankOrder(ids) {
  const previous = rankOrderLocal;
  rankOrderLocal = ids;
  renderRanking();                            // retour visuel immédiat
  updateDelibCounts();
  try {
    await updateDoc(doc(db, 'campaigns', currentCampaign.id), { rankOrder: ids });
    currentCampaign.rankOrder = ids;
    document.getElementById('btn-reset-order').style.display = '';
  } catch (err) {
    // Ne pas laisser l'écran mentir sur un ordre qui n'a pas été enregistré.
    rankOrderLocal = previous;
    renderRanking();
    updateDelibCounts();
    showToast('Ordre non enregistré : ' + err.message, 'error');
  }
}


// ─── Filters (list mode only) ─────────────────────────────────────
// ─── Modifier le profil d'un cooptant ─────────────────────────────
/**
 * Formulaire d'édition dans la fiche dépliée : prénom, nom, email et toutes
 * les questions du formulaire (même celles restées sans réponse, par exemple
 * pour quelqu'un inscrit sur un stand). Les réponses sont rangées sous la même
 * clé que celles du cooptant (`cleReponse`), jamais par position.
 */
function ouvrirEdition(c, body, editBtn) {
  if (body.querySelector('.cand-edit')) return;
  const reponses = body.querySelector('.cand-reponses');
  const champ = (q, qi) => {
    const id = `edit-${c.id}-${qi}`;
    const v = String(texteReponse(reponseA(c, q, qi)) ?? '');
    let input;
    if (q.type === 'longtext') input = `<textarea class="form-textarea" id="${id}" rows="3">${esc(v)}</textarea>`;
    else if (q.type === 'select' && q.options?.length) {
      const opts = [...q.options];
      if (v && !opts.includes(v)) opts.unshift(v);   // ancienne option : on ne la perd pas
      input = `<select class="form-select" id="${id}"><option value="">·</option>${opts.map(o =>
        `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else if (q.type === 'checkbox') {
      return `<label class="checkbox-wrap" style="cursor:pointer;"><input type="checkbox" id="${id}"${v === 'Oui' ? ' checked' : ''} /><span>${esc(q.label)}</span></label>`;
    } else input = `<input class="form-input" id="${id}" value="${esc(v)}" />`;
    return `<div class="form-group"><label class="form-label" for="${id}">${esc(q.label)}</label>${input}</div>`;
  };
  const form = document.createElement('div');
  form.className = 'cand-edit';
  form.innerHTML = `
    <div class="cand-section-t" style="margin:0;">Modifier le profil</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label" for="edit-${c.id}-prenom">Prénom</label>
        <input class="form-input" id="edit-${c.id}-prenom" value="${esc(c.prenom || '')}" /></div>
      <div class="form-group"><label class="form-label" for="edit-${c.id}-nom">Nom</label>
        <input class="form-input" id="edit-${c.id}-nom" value="${esc(c.nom || '')}" /></div>
    </div>
    <div class="form-group"><label class="form-label" for="edit-${c.id}-email">Email</label>
      <input class="form-input" type="email" id="edit-${c.id}-email" value="${esc(c.email || '')}" />
      <span class="form-hint">S'il revient sur le formulaire, c'est avec cette adresse qu'il retrouvera sa candidature.</span></div>
    ${customQuestions.map(champ).join('')}
    <div class="cand-edit-actions">
      <button type="button" class="btn btn-primary btn-sm" data-act="save">Enregistrer</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="cancel">Annuler</button>
    </div>`;

  const fermer = () => { form.remove(); if (reponses) reponses.hidden = false; editBtn.disabled = false; };
  if (reponses) reponses.hidden = true;
  editBtn.disabled = true;
  (body.querySelector('.cand-infos') || body.querySelector('.cand-actions')).after(form);
  form.querySelector('input')?.focus();

  form.querySelector('[data-act="cancel"]').addEventListener('click', fermer);
  form.querySelector('[data-act="save"]').addEventListener('click', async e => {
    const val = id => form.querySelector(`#edit-${c.id}-${id}`);
    const prenom = val('prenom').value.trim();
    const nom    = val('nom').value.trim();
    const email  = val('email').value.trim().toLowerCase();
    if (!prenom || !nom) return showToast('Le prénom et le nom sont requis.', 'error');
    if (email && !email.includes('@')) return showToast('Adresse email invalide.', 'error');

    const customAnswers = { ...(c.customAnswers || {}) };
    customQuestions.forEach((q, qi) => {
      const el = val(qi);
      if (!el) return;
      const v = el.type === 'checkbox' ? (el.checked ? 'Oui' : '') : el.value.trim();
      const cle = cleReponse(c, q, qi);
      if (!v && customAnswers[cle] === undefined) return;   // rien avant, rien maintenant
      customAnswers[cle] = { label: q.label, value: v };
    });

    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = 'Enregistrement…';
    try {
      await updateDoc(doc(db, 'candidates', c.id), { prenom, nom, email, customAnswers });
      Object.assign(c, { prenom, nom, email, customAnswers });
      showToast('Profil mis à jour.', 'success');
      applyFilters();
      // La liste est redessinée : on rouvre la fiche qu'on vient de modifier.
      document.querySelector(`.cand-card[data-id="${CSS.escape(c.id)}"] [aria-expanded]`)?.click();
    } catch (err) {
      showToast('Erreur : ' + err.message, 'error');
      btn.disabled = false; btn.textContent = 'Enregistrer';
    }
  });
}

/** Filtre de la liste : un statut, ou un des filtres « Autres ». */
function passeFiltre(c, f) {
  if (!f) return true;
  if (f === 'sans-entretien') return !entretienParCooptant[c.id];
  if (f === 'stand') return c.source === 'stand';
  if (f === 'en') return c.langue === 'en';
  if (f === 'non-evalue') return !c._nbEvals;
  return c.statut === f;
}

/** Tri de la liste (menu « Trier »). Toujours un départage stable par nom. */
function trierListe(cands, tri) {
  const date = c => c.createdAt?.toMillis?.() ?? 0;
  const nom = c => pourRecherche(`${c.prenom || ''} ${c.nom || ''}`);
  const parNom = (a, b) => nom(a).localeCompare(nom(b), 'fr');
  const score = c => c._score ?? (c._noteGlobaleAvg !== null && c._noteGlobaleAvg !== undefined ? Math.round(c._noteGlobaleAvg * 5) : null);
  const cmp = {
    recent:     (a, b) => date(b) - date(a),
    ancien:     (a, b) => date(a) - date(b),
    nom:        parNom,
    'nom-desc': (a, b) => parNom(b, a),
    // Sans entretien : à la fin.
    entretien:  (a, b) => (entretienParCooptant[a.id]?.getTime() ?? Infinity) - (entretienParCooptant[b.id]?.getTime() ?? Infinity),
    // Pas encore noté : à la fin.
    score:      (a, b) => (score(b) ?? -1) - (score(a) ?? -1),
  }[tri] || ((a, b) => date(b) - date(a));
  return [...cands].sort((a, b) => cmp(a, b) || parNom(a, b));
}

function applyFilters() {
  if (currentView === 'classement') { renderRanking(); return; }
  // Sans accents : « celeste » trouve « Céleste ».
  const s = pourRecherche(document.getElementById('search').value);
  const f = document.getElementById('filter-statut').value;
  renderList(trierListe(allCandidates.filter(c =>
    (!s || pourRecherche(`${c.prenom} ${c.nom} ${c.email}`).includes(s)) && passeFiltre(c, f)
  ), document.getElementById('tri-liste').value));
}

// ─── Réponses au formulaire ───────────────────────────────────────
// La logique vit dans utils.js (partagée avec le popup du planning).
function reponsesOrdonnees(c) { return reponsesSelonQuestions(c, customQuestions); }

// ─── CSV Export ───────────────────────────────────────────────────
function exportCSV() {
  if (!allCandidates.length) return showToast('Aucun cooptant à exporter.', 'error');

  // Ce que l'export faisait mal, et qu'il ne faut pas réintroduire :
  //  - intitulés non entre guillemets : une question contenant une virgule
  //    (« …relations humaines, etc. ») se coupait en plusieurs colonnes et
  //    décalait tout le fichier ;
  //  - séparateur « , » : Excel en français attend « ; » et mettait tout dans
  //    une seule colonne ;
  //  - téléphone lu dans l'ancien champ fixe (vide) ;
  //  - statut brut (« place »), zéro effacé par `v || ''` ;
  //  - colonnes d'évaluation toutes vides tant que personne n'est évalué.
  const SEP = ';';
  const cellule = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const nombre  = (v, dec = 0) => v === null || v === undefined || v === '' ? '' : Number(v).toFixed(dec).replace('.', ',');
  const hm = d => d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

  const sorted  = getSortedCandidates();
  const evalues = allCandidates.some(c => c._nbEvals > 0);
  // Le rang n'a de sens qu'une fois un classement établi (scores ou ordre manuel).
  const classe  = evalues || rankOrderLocal.length > 0;

  // Téléphone : colonne dédiée, donc la question correspondante n'est pas répétée.
  const questionsTel = new Set(sorted.map(c => {
    const t = telephoneCooptant(c, customQuestions);
    return customQuestions.findIndex((q, qi) => t && texteReponse(reponseA(c, q, qi)).trim() === t);
  }).filter(i => i >= 0));
  const questions = customQuestions.map((q, qi) => ({ q, qi })).filter(({ qi }) => !questionsTel.has(qi));

  const colonnes = [];
  if (classe) colonnes.push(['Rang', (c, i) => i + 1]);
  colonnes.push(
    ['Prénom', c => c.prenom],
    ['Nom', c => c.nom],
    ['Email', c => c.email],
    ['Téléphone', c => telephoneCooptant(c, customQuestions)],
    ['Statut', c => BADGES[c.statut]?.[1] || c.statut || ''],
    ['Entretien', c => {
      const d = entretienParCooptant[c.id];
      return d ? `${d.toLocaleDateString('fr-FR')} ${hm(d)}` : '';
    }],
  );
  questions.forEach(({ q, qi }) => colonnes.push([q.label, c => texteReponse(reponseA(c, q, qi))]));
  if (evalues) {
    colonnes.push(
      ['Score %', c => nombre(c._score)],
      ['Critères notés', c => c._nbCriteresTotal && c._nbEvals ? `${c._nbCriteresNotes}/${c._nbCriteresTotal}` : ''],
      ['Nb jurys', c => c._nbEvals || ''],
      ['Note globale /20', c => nombre(c._noteGlobaleAvg, 1)],
    );
    criteriaConfig.forEach(cr => colonnes.push([`Jury : ${cr.label}`, c => {
      // Chaque type a sa propre lecture : la moyenne n'a de sens que pour les
      // critères chiffrés, les autres exportent leur réponse agrégée.
      const avg = c._criteriaAvgs?.[cr.id];
      if (avg) return nombre(avg.avg, 2);
      const choice = c._choiceAnswers?.find(x => x.id === cr.id);
      if (choice) return choice.items.map(i => `${i.option} (${i.n}/${choice.total})`).join(' · ');
      const yn = c._yesnoAnswers?.find(x => x.id === cr.id);
      if (yn) return cr.type === 'check' ? `${yn.oui}/${yn.total}` : `oui ${yn.oui} / non ${yn.non}`;
      const txt = c._textAnswers?.find(x => x.id === cr.id);
      if (txt) return txt.values.join(' | ');
      return '';
    }]));
    colonnes.push(['Commentaires jury', c => (c._comments || []).map(cm => cm.text).join(' | ')]);
  }
  colonnes.push(
    ['Notes internes', c => c._note || ''],
    ['Candidature reçue le', c => c.createdAt ? formatDatetime(c.createdAt) : ''],
  );

  const lignes = [
    colonnes.map(([titre]) => cellule(titre)).join(SEP),
    ...sorted.map((c, i) => colonnes.map(([, val]) => cellule(val(c, i))).join(SEP)),
  ];
  // BOM : sans lui, Excel lit les accents de travers. \r\n : fin de ligne attendue par Excel.
  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const nomAsso = (currentOrg?.slug || 'asso').replace(/[^a-z0-9-]/gi, '');
  const a = document.createElement('a'); a.href = url; a.download = `cooptants-${nomAsso}-${localDateISO()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('Export CSV téléchargé.', 'success');
}

function localDateISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

init();

// ── Eval side panel ───────────────────────────────────────────
function openEvalPanel(candidateId) {
  const url = `/secge/evaluer.html?candidateId=${candidateId}&campaignId=${currentCampaign?.id}&panel=1`;
  document.getElementById('eval-panel-iframe').src = url;
  document.getElementById('eval-panel-overlay').classList.add('open');
  document.getElementById('eval-panel').classList.add('open');
}

function closeEvalPanel() {
  document.getElementById('eval-panel-overlay').classList.remove('open');
  document.getElementById('eval-panel').classList.remove('open');
  document.getElementById('eval-panel-iframe').src = '';
  if (currentCampaign) loadCampaign(currentCampaign);
}

window.closeEvalPanel = closeEvalPanel;

window.addEventListener('message', e => {
  if (e.data === 'eval-saved') closeEvalPanel();
});

document.getElementById('eval-panel-overlay').addEventListener('click', closeEvalPanel);
</script>

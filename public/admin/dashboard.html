<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem("_theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Cooptly</title>
  <!-- Connexions ouvertes d'avance : sans elles, chaque serveur (polices,
       SDK, base de données) coûtait sa propre poignée de main réseau au
       moment où la page en avait besoin. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Le SDK est préchargé dès l'en-tête. Sinon le navigateur ne le
       découvre qu'en arrivant au script, tout en bas de la page. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" />
  <!-- modules du site préchargés (scripts/precharger-modules.mjs) -->
  <link rel="modulepreload" href="/js/auth.js" />
  <link rel="modulepreload" href="/js/firebase-config.js" />
  <link rel="modulepreload" href="/js/icones.js" />
  <link rel="modulepreload" href="/js/nav.js" />
  <link rel="modulepreload" href="/js/org-lookup.js" />
  <link rel="modulepreload" href="/js/recherche.js" />
  <link rel="modulepreload" href="/js/tuto.js" />
  <link rel="modulepreload" href="/js/utils.js" />
  <!-- /modules -->
  <!-- Polices en <link> et non plus en @import dans main.css : l'@import
       obligeait à télécharger la feuille de style avant même de découvrir
       les polices, trois allers-retours à la suite avant le texte. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<nav class="nav">
  <a href="/admin/dashboard.html" class="nav-brand">
    <div class="nav-brand-icon">C</div>
    <span class="nav-brand-name">Cooptly</span>
  </a>
    <div class="nav-links">
    <a href="/admin/dashboard.html" class="nav-link active">Vue d'ensemble</a>
    <a href="/admin/organisations.html" class="nav-link">Organisations</a>
    <a href="/admin/permissions.html" class="nav-link">Permissions</a>
    <a href="/admin/connexions.html" class="nav-link">Connexions</a>
    <a href="/admin/data.html" class="nav-link">Base de données</a>
  </div>
  <div class="nav-right">
    <span id="user-name" style="font-size:13px;color:var(--text-muted);"></span>
    <button class="btn btn-ghost btn-sm" id="btn-logout">Déconnexion</button>
  </div>
</nav>

<main class="page">

  <div class="flex-between mb-24">
    <div><h1>Vue d'ensemble</h1><p>Toutes les associations de la plateforme</p></div>
    <a href="/admin/organisations.html" class="btn btn-primary">+ Nouvelle organisation</a>
  </div>

  <!-- Stats globales -->
  <div class="stats-grid mb-24" id="global-stats">
    <div class="stat-card"><div class="stat-value" id="stat-orgs">·</div><div class="stat-label">Associations</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-campaigns">·</div><div class="stat-label">Recrutements ouverts</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-candidates">·</div><div class="stat-label">Cooptations totales</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-users">·</div><div class="stat-label">Membres des bureaux</div></div>
  </div>

  <!-- Liste des organisations -->
  <div class="card">
    <h2 class="mb-16">Associations</h2>
    <div id="orgs-loading" style="text-align:center;padding:40px;"><div class="spinner" style="margin:auto;"></div></div>
    <div id="orgs-list" style="display:none;"></div>
  </div>

</main>

<script type="module">
import { requireAdmin, logout } from '/js/auth.js';
import { app } from '/js/auth.js';
import { getFirestore, collection, getDocs, query, where }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { initBurgerMenu } from '/js/nav.js';
import { esc, regrouperMembres } from '/js/utils.js';
import { icone } from '/js/icones.js';

/**
 * État du recrutement d'une asso, avec la même règle que le reste de la
 * plateforme (badge du tableau de bord) : ouvert si `recrutementOuvert` n'est
 * pas false et `statut` pas 'fermee' ; `etat` dit s'il est clôturé ou en préparation.
 */
function etatRecrutement(camp) {
  if (!camp) return { cle: 'aucun', libelle: 'Pas encore de recrutement', badge: 'badge-gray' };
  if (camp.etat === 'cloture') return { cle: 'cloture', libelle: 'Clôturé', badge: 'badge-gray' };
  if (camp.etat === 'preparation') return { cle: 'preparation', libelle: 'En préparation', badge: 'badge-orange' };
  return camp.recrutementOuvert !== false && camp.statut !== 'fermee'
    ? { cle: 'ouvert', libelle: 'Recrutement ouvert', badge: 'badge-green' }
    : { cle: 'ferme', libelle: 'Recrutement fermé', badge: 'badge-gray' };
}

const db = getFirestore(app);

async function init() {
  const user = await requireAdmin();
  // Le menu se construit EN PARALLÈLE des données : l'attendre retardait
  // tout l'affichage de la page, alors qu'il n'en conditionne rien.
  initBurgerMenu(user).catch(e => console.warn('Menu non construit :', e));
  document.getElementById('user-name').textContent = user.displayName || user.email.split('@')[0];
  document.getElementById('btn-logout').addEventListener('click', async () => { await logout(); location.href='/index.html'; });

  const [orgsSnap, campaignsSnap, candidatesSnap, membersSnap] = await Promise.all([
    getDocs(collection(db, 'organizations')),
    getDocs(collection(db, 'campaigns')),
    getDocs(collection(db, 'candidates')),
    getDocs(collection(db, 'memberships'))
  ]);

  const orgs = orgsSnap.docs.map(d => ({id:d.id,...d.data()}));
  const campaigns = campaignsSnap.docs.map(d => ({id:d.id,...d.data()}));
  const memberships = membersSnap.docs.map(d => ({id:d.id,...d.data()}));
  // Une personne pré-ajoutée par email a deux fiches : on compte les personnes.
  const parOrg = orgs.map(org => {
    const camp = campaigns.find(c => c.organizationId === org.id);
    const membres = regrouperMembres(memberships.filter(m => m.organizationId === org.id), org.id);
    const cooptants = candidatesSnap.docs.filter(d => d.data().organizationId === org.id || (camp && d.data().campaignId === camp.id)).length;
    return { org, camp, membres, cooptants, etat: etatRecrutement(camp) };
  });
  document.getElementById('stat-orgs').textContent = orgs.length;
  document.getElementById('stat-campaigns').textContent = parOrg.filter(x => x.etat.cle === 'ouvert').length;
  document.getElementById('stat-candidates').textContent = candidatesSnap.size;
  document.getElementById('stat-users').textContent = parOrg.reduce((n, x) => n + x.membres.length, 0);
  const list = document.getElementById('orgs-list');
  list.style.display = '';
  document.getElementById('orgs-loading').style.display = 'none';
  if (!orgs.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">' + icone('personnes') + '</div><p>Aucune organisation. <a href="/admin/organisations.html">Créez-en une.</a></p></div>';
    return;
  }
  parOrg.sort((a, b) => (a.org.name || '').localeCompare(b.org.name || '', 'fr')).forEach(({ org, membres, cooptants, etat }) => {
    const card = document.createElement('div');
    card.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--border);gap:12px;flex-wrap:wrap;';
    const couleur = /^#[0-9a-f]{3,8}$/i.test(org.primaryColor || '') ? org.primaryColor : 'var(--indigo)';
    card.innerHTML = `
      <div style="display:flex;align-items:center;gap:14px;">
        ${org.logoBase64
          ? `<img src="${esc(org.logoBase64)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex-shrink:0;" />`
          : `<div style="width:40px;height:40px;border-radius:50%;background:${couleur};display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;">${esc((org.name || '?')[0])}</div>`
        }
        <div>
          <div style="font-weight:700;font-size:15px;">${esc(org.name || 'Sans nom')}</div>
          <div style="font-size:13px;color:var(--text-muted);">/${esc(org.slug || org.id)} · ${membres.length} membre${membres.length > 1 ? 's' : ''} du bureau · ${cooptants} cooptant${cooptants > 1 ? 's' : ''}</div>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="badge ${etat.badge}">${etat.libelle}</span>
        <a href="/secge/dashboard.html?org=${encodeURIComponent(org.id)}" class="btn btn-ghost btn-sm">Gérer →</a>
      </div>`;
    list.appendChild(card);
  });
}
init();
</script>
</body>
</html>

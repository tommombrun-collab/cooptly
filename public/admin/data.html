<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script>(function(){var t=localStorage.getItem("_theme");if(t)document.documentElement.setAttribute("data-theme",t);})();</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base de données · Admin</title>
  <!-- Connexions ouvertes d'avance : sans elles, chaque serveur (polices,
       SDK, base de données) coûtait sa propre poignée de main réseau au
       moment où la page en avait besoin. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- Le SDK est préchargé dès l'en-tête. Sinon le navigateur ne le
       découvre qu'en arrivant au script, tout en bas de la page. -->
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" />
  <!-- Polices en <link> et non plus en @import dans main.css : l'@import
       obligeait à télécharger la feuille de style avant même de découvrir
       les polices, trois allers-retours à la suite avant le texte. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antic&family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { background: var(--bg); }

    /* ── Layout ──────────────────────────────────────────────── */
    .db-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: calc(100vh - 64px);
    }

    /* ── Sidebar ─────────────────────────────────────────────── */
    .db-sidebar {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 20px 10px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
      overflow-y: auto;
    }
    .db-sidebar-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      padding: 0 10px;
      margin-bottom: 6px;
    }
    .coll-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      transition: background .12s;
      gap: 8px;
      font-family: inherit;
      margin-bottom: 2px;
    }
    .coll-btn:hover { background: var(--bg); }
    .coll-btn.active {
      background: var(--indigo-light);
      color: var(--indigo);
      font-weight: 700;
    }
    .coll-count {
      font-size: 11px;
      font-weight: 600;
      background: var(--border);
      color: var(--text-muted);
      border-radius: 99px;
      padding: 1px 7px;
      flex-shrink: 0;
      transition: background .12s, color .12s;
    }
    .coll-btn.active .coll-count { background: var(--indigo); color: #fff; }

    /* ── Main area ───────────────────────────────────────────── */
    .db-main {
      padding: 24px;
      background: var(--surface);
      overflow-x: auto;
    }

    .db-toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    /* ── Data table ──────────────────────────────────────────── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table th {
      background: var(--bg);
      padding: 8px 12px;
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    .data-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: middle;
    }
    .data-table tbody tr { cursor: pointer; transition: background .08s; }
    .data-table tbody tr:hover td { background: var(--bg); }
    .cell-mono {
      font-family: 'Monaco','Menlo',monospace;
      font-size: 11px;
      color: var(--text-muted);
    }
    .cell-color-wrap { display: flex; align-items: center; gap: 7px; }
    .color-dot {
      width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0;
      border: 1px solid rgba(0,0,0,.10);
    }

    /* ── Doc modal ───────────────────────────────────────────── */
    #doc-overlay {
      display: none;
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(15,23,42,.5); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; padding: 24px;
    }
    #doc-overlay.open { display: flex; }
    #doc-modal {
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 24px 64px rgba(0,0,0,.22);
      width: 100%; max-width: 660px;
      max-height: 82vh;
      display: flex; flex-direction: column;
      animation: popup-in .16s ease;
    }
    @keyframes popup-in { from { opacity:0; transform:translateY(10px) scale(.97); } }
    #doc-modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px;
    }
    #doc-modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    #doc-json {
      font-family: 'Monaco','Menlo','Courier New',monospace;
      font-size: 12px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
      color: var(--text);
    }
    #doc-modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="/admin/dashboard.html" class="nav-brand">
    <div class="nav-brand-icon">C</div>
    <span class="nav-brand-name">Cooptly</span>
  </a>
    <div class="nav-links">
    <a href="/admin/dashboard.html"    class="nav-link">Vue d'ensemble</a>
    <a href="/admin/organisations.html" class="nav-link">Organisations</a>
    <a href="/admin/permissions.html"  class="nav-link">Permissions</a>
    <a href="/admin/connexions.html" class="nav-link">Connexions</a>
    <a href="/admin/data.html"         class="nav-link active">Base de données</a>
  </div>
  <div class="nav-right">
    <button class="btn btn-ghost btn-sm" id="btn-logout">Déconnexion</button>
  </div>
</nav>

<div class="db-layout">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside class="db-sidebar">
    <div class="db-sidebar-label">Collections</div>
    <div id="coll-list"></div>
  </aside>

  <!-- ── Main ─────────────────────────────────────────────────── -->
  <div class="db-main">

    <!-- Empty state -->
    <div id="db-empty" class="empty-state" style="margin-top:80px;">
      <div class="empty-state-icon">🗄️</div>
      <p>Sélectionne une collection dans le menu à gauche.</p>
    </div>

    <!-- Content -->
    <div id="db-content" style="display:none;">

      <div class="db-toolbar">
        <div>
          <h2 id="coll-title" style="margin:0;font-size:20px;"></h2>
          <div id="coll-subtitle" class="text-sm text-muted" style="margin-top:2px;"></div>
        </div>
        <input class="form-input" id="db-search"
          placeholder="🔍 Rechercher dans les résultats…"
          style="width:260px;font-size:13px;margin-left:auto;" />
        <button class="btn btn-ghost btn-sm" id="btn-refresh" title="Actualiser">↻</button>
      </div>

      <div id="db-loading" style="text-align:center;padding:48px;display:none;">
        <div class="spinner" style="margin:auto;"></div>
      </div>

      <div style="overflow-x:auto;" id="table-wrap">
        <table class="data-table">
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div id="db-no-results" class="empty-state" style="display:none;padding:40px 0;">
        <div class="empty-state-icon" style="font-size:28px;">🔍</div>
        <p>Aucun résultat pour cette recherche.</p>
      </div>

    </div>
  </div>
</div>

<!-- ── Document detail modal ─────────────────────────────────── -->
<div id="doc-overlay">
  <div id="doc-modal">
    <div id="doc-modal-header">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:700;font-size:15px;" id="doc-modal-title"></div>
        <div id="doc-modal-id" class="cell-mono" style="margin-top:3px;font-size:11px;word-break:break-all;"></div>
      </div>
      <button onclick="closeDocModal()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--text-muted);line-height:1;padding:2px;flex-shrink:0;">✕</button>
    </div>
    <div id="doc-modal-body">
      <pre id="doc-json"></pre>
    </div>
    <div id="doc-modal-footer">
      <button class="btn btn-ghost btn-sm" onclick="copyDocJson()">📋 Copier JSON</button>
      <button class="btn btn-danger btn-sm" id="btn-delete-doc" style="margin-left:auto;" onclick="deleteCurrentDoc()">🗑 Supprimer ce document</button>
      <button class="btn btn-ghost btn-sm" onclick="closeDocModal()">Fermer</button>
    </div>
  </div>
</div>

<script type="module">
import { requireAdmin, logout, app } from '/js/auth.js';
import { initBurgerMenu } from '/js/nav.js';
import { getFirestore, collection, getDocs, doc, deleteDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { showToast, confirmDialog } from '/js/utils.js';

const db = getFirestore(app);

// ─── Collection schema ────────────────────────────────────────
const COLLECTIONS = {
  organizations: {
    label: '🏢 Organisations',
    cols: [
      { key: 'id',           label: 'ID',          type: 'mono' },
      { key: 'name',         label: 'Nom',         type: 'text' },
      { key: 'primaryColor', label: 'Couleur',     type: 'color' },
    ],
    search: ['name', 'id'],
  },
  memberships: {
    label: '👥 Membres',
    cols: [
      { key: 'displayName',    label: 'Nom',           type: 'text' },
      { key: 'email',          label: 'Email',         type: 'text' },
      { key: 'role',           label: 'Rôle',          type: 'badge' },
      { key: 'organizationId', label: 'Organisation',  type: 'mono' },
      { key: 'joinedAt',       label: 'Inscrit le',    type: 'date' },
    ],
    search: ['email', 'displayName', 'organizationId'],
  },
  campaigns: {
    label: '📣 Campagnes',
    cols: [
      { key: 'name',           label: 'Nom',          type: 'text' },
      { key: 'statut',         label: 'Statut',       type: 'badge' },
      { key: 'organizationId', label: 'Organisation', type: 'mono' },
      { key: 'dateDebut',      label: 'Début',        type: 'date' },
      { key: 'dateFin',        label: 'Fin',          type: 'date' },
      { key: 'nbPlaces',       label: 'Places',       type: 'text' },
    ],
    search: ['name', 'organizationId'],
  },
  candidates: {
    label: '🧑 Cooptants',
    cols: [
      { key: 'prenom',     label: 'Prénom',    type: 'text' },
      { key: 'nom',        label: 'Nom',       type: 'text' },
      { key: 'email',      label: 'Email',     type: 'text' },
      { key: 'statut',     label: 'Statut',    type: 'badge' },
      { key: 'campaignId', label: 'Campagne',  type: 'mono' },
      { key: 'createdAt',  label: 'Soumis le', type: 'date' },
    ],
    search: ['prenom', 'nom', 'email'],
  },
  interviews: {
    label: '📅 Entretiens',
    cols: [
      { key: 'candidateId',   label: 'Cooptant',  type: 'mono' },
      { key: 'datetimeStart', label: 'Début',     type: 'date' },
      { key: 'datetimeEnd',   label: 'Fin',       type: 'date' },
      { key: 'statut',        label: 'Statut',    type: 'badge' },
      { key: 'jury1Id',       label: 'Jury 1',    type: 'mono' },
      { key: 'salleNom',      label: 'Salle',     type: 'text' },
    ],
    search: ['candidateId', 'campaignId'],
  },
  interview_evaluations: {
    label: '📝 Évaluations',
    cols: [
      { key: 'candidateId', label: 'Cooptant',   type: 'mono' },
      { key: 'evaluatedBy', label: 'Évaluateur', type: 'mono' },
      { key: 'decision',    label: 'Décision',   type: 'badge' },
      { key: 'noteGlobale', label: 'Note /20',   type: 'text' },
      { key: 'campaignId',  label: 'Campagne',   type: 'mono' },
      { key: 'updatedAt',   label: 'Modifié le', type: 'date' },
    ],
    search: ['candidateId', 'evaluatedBy', 'campaignId'],
  },
  invite_codes: {
    label: '🔑 Codes invitation',
    cols: [
      { key: 'id',             label: 'Code',         type: 'text' },
      { key: 'label',          label: 'Libellé',      type: 'text' },
      { key: 'organizationId', label: 'Organisation', type: 'mono' },
      { key: 'role',           label: 'Rôle',         type: 'badge' },
      { key: 'active',         label: 'Actif',        type: 'bool' },
    ],
    search: ['id', 'label', 'organizationId'],
  },
  staff_availabilities: {
    label: '🗓 Disponibilités',
    cols: [
      { key: 'userId',     label: 'Membre',    type: 'mono' },
      { key: 'campaignId', label: 'Campagne',  type: 'mono' },
    ],
    search: ['userId', 'campaignId'],
  },
  rooms: {
    label: '🏫 Salles',
    cols: [
      { key: 'code',           label: 'Code',         type: 'text' },
      { key: 'name',           label: 'Nom',          type: 'text' },
      { key: 'organizationId', label: 'Organisation', type: 'mono' },
      { key: 'capacity',       label: 'Capacité',     type: 'text' },
    ],
    search: ['code', 'name'],
  },
  users: {
    label: '👤 Utilisateurs',
    cols: [
      { key: 'displayName', label: 'Nom',       type: 'text' },
      { key: 'email',       label: 'Email',     type: 'text' },
      { key: 'createdAt',   label: 'Créé le',   type: 'date' },
    ],
    search: ['email', 'displayName'],
  },
  platform_admins: {
    label: '🔐 Admins plateforme',
    cols: [
      { key: 'id',    label: 'UID',   type: 'mono' },
      { key: 'email', label: 'Email', type: 'text' },
    ],
    search: ['email', 'id'],
  },
};

// ─── State ────────────────────────────────────────────────────
let currentColl = null;
let allDocs = [];
let filteredDocs = [];
let currentDoc = null;

// ─── Badge colors ─────────────────────────────────────────────
const BADGE_MAP = {
  ouverte: 'badge-green', fermee: 'badge-gray', archivee: 'badge-gray',
  recu: 'badge-orange', place: 'badge-indigo', entretien_fait: 'badge-green',
  accepte: 'badge-green', refuse: 'badge-gray', reserve: 'badge-orange',
  admin: 'badge-red', secge: 'badge-indigo', president: 'badge-indigo', member: 'badge-gray',
  planifie: 'badge-indigo', annule: 'badge-gray',
};

// ─── Init ─────────────────────────────────────────────────────
async function init() {
  const user = await requireAdmin();
  // Le menu se construit EN PARALLÈLE des données : l'attendre retardait
  // tout l'affichage de la page, alors qu'il n'en conditionne rien.
  initBurgerMenu(user).catch(e => console.warn('Menu non construit :', e));
  document.getElementById('btn-logout').addEventListener('click', async () => {
    await logout(); location.href = '/index.html';
  });
  document.getElementById('btn-refresh').addEventListener('click', () => {
    if (currentColl) selectCollection(currentColl);
  });
  document.getElementById('db-search').addEventListener('input', applySearch);

  // Build sidebar buttons
  const list = document.getElementById('coll-list');
  for (const [key, cfg] of Object.entries(COLLECTIONS)) {
    const btn = document.createElement('button');
    btn.className = 'coll-btn';
    btn.dataset.coll = key;
    btn.innerHTML = `<span>${cfg.label}</span><span class="coll-count" id="cnt-${key}">…</span>`;
    btn.addEventListener('click', () => selectCollection(key));
    list.appendChild(btn);
  }

  // Load counts async
  loadAllCounts();
}

async function loadAllCounts() {
  for (const key of Object.keys(COLLECTIONS)) {
    try {
      const snap = await getDocs(collection(db, key));
      const el = document.getElementById(`cnt-${key}`);
      if (el) el.textContent = snap.size;
    } catch { /* skip */ }
  }
}

// ─── Select & load collection ─────────────────────────────────
async function selectCollection(key) {
  currentColl = key;
  const cfg = COLLECTIONS[key];

  document.querySelectorAll('.coll-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-coll="${key}"]`).classList.add('active');

  document.getElementById('db-empty').style.display   = 'none';
  document.getElementById('db-content').style.display = '';
  document.getElementById('db-loading').style.display = '';
  document.getElementById('table-wrap').style.display = 'none';
  document.getElementById('db-no-results').style.display = 'none';
  document.getElementById('db-search').value = '';
  document.getElementById('coll-title').textContent = cfg.label;
  document.getElementById('coll-subtitle').textContent = 'Chargement…';

  try {
    const snap = await getDocs(collection(db, key));
    allDocs = snap.docs.map(d => ({ _id: d.id, ...d.data() }));
    const n = allDocs.length;
    document.getElementById(`cnt-${key}`).textContent = n;
    document.getElementById('coll-subtitle').textContent = `${n} document${n !== 1 ? 's' : ''}`;
  } catch(e) {
    showToast('Erreur : ' + e.message, 'error');
    allDocs = [];
    document.getElementById('coll-subtitle').textContent = 'Erreur de chargement';
  }

  document.getElementById('db-loading').style.display = 'none';
  document.getElementById('table-wrap').style.display = '';

  buildHeader(cfg.cols);
  filteredDocs = [...allDocs];
  renderRows(filteredDocs, cfg.cols);
}

// ─── Table header ─────────────────────────────────────────────
function buildHeader(cols) {
  const head = document.getElementById('table-head');
  head.innerHTML = '';
  const tr = document.createElement('tr');
  cols.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.label;
    tr.appendChild(th);
  });
  tr.appendChild(document.createElement('th')); // actions
  head.appendChild(tr);
}

// ─── Render rows ──────────────────────────────────────────────
function renderRows(docs, cols) {
  const tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  document.getElementById('db-no-results').style.display = docs.length ? 'none' : '';

  docs.forEach(d => {
    const tr = document.createElement('tr');
    cols.forEach(c => {
      const td = document.createElement('td');
      td.innerHTML = renderCell(d[c.key], c.type);
      tr.appendChild(td);
    });
    // Actions cell
    const tdAct = document.createElement('td');
    tdAct.style.cssText = 'text-align:right;width:60px;';
    tdAct.innerHTML = `<button class="btn btn-ghost btn-sm" style="font-size:11px;padding:3px 8px;">Voir ›</button>`;
    tr.appendChild(tdAct);

    tr.addEventListener('click', () => openModal(d));
    tbody.appendChild(tr);
  });
}

function renderCell(val, type) {
  if (val === null || val === undefined || val === '')
    return '<span style="color:var(--border);font-size:11px;">·</span>';

  if (type === 'mono') {
    const s = String(val);
    return `<span class="cell-mono" title="${s}">${s.length > 18 ? s.slice(0,16)+'…' : s}</span>`;
  }
  if (type === 'date') {
    const d = val?.toDate ? val.toDate() : (typeof val === 'string' ? new Date(val) : null);
    if (!d || isNaN(d)) return '<span style="color:var(--text-light);font-size:11px;">·</span>';
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})
      + ' ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  if (type === 'badge') {
    const bc = BADGE_MAP[val] || 'badge-gray';
    return `<span class="badge ${bc}" style="font-size:11px;">${val}</span>`;
  }
  if (type === 'bool') {
    return val
      ? '<span class="badge badge-green" style="font-size:11px;">✓ Oui</span>'
      : '<span class="badge badge-gray"  style="font-size:11px;">✗ Non</span>';
  }
  if (type === 'color') {
    return `<span class="cell-color-wrap"><span class="color-dot" style="background:${val};"></span>${val}</span>`;
  }
  // text
  const s = String(val);
  return `<span title="${s.replace(/"/g,"'")}">${s.length > 45 ? s.slice(0,43)+'…' : s}</span>`;
}

// ─── Search ───────────────────────────────────────────────────
function applySearch() {
  const q = document.getElementById('db-search').value.toLowerCase().trim();
  const cfg = COLLECTIONS[currentColl];
  filteredDocs = q
    ? allDocs.filter(d =>
        cfg.search.some(f => String(d[f] || '').toLowerCase().includes(q)) ||
        d._id.toLowerCase().includes(q))
    : [...allDocs];

  document.getElementById('coll-subtitle').textContent =
    q ? `${filteredDocs.length} / ${allDocs.length} documents` : `${allDocs.length} document${allDocs.length !== 1 ? 's' : ''}`;

  renderRows(filteredDocs, cfg.cols);
}

// ─── Document modal ───────────────────────────────────────────
function openModal(d) {
  currentDoc = d;
  const cfg = COLLECTIONS[currentColl];
  document.getElementById('doc-modal-title').textContent = cfg.label;
  document.getElementById('doc-modal-id').textContent = `ID : ${d._id}`;

  // Serialize cleanly (convert Timestamps)
  const clean = {};
  for (const [k, v] of Object.entries(d)) {
    if (k === '_id') continue;
    if (v?.toDate) {
      clean[k] = v.toDate().toLocaleString('fr-FR');
    } else if (typeof v === 'object' && v !== null && v.seconds !== undefined) {
      clean[k] = new Date(v.seconds * 1000).toLocaleString('fr-FR');
    } else {
      clean[k] = v;
    }
  }

  document.getElementById('doc-json').textContent = JSON.stringify(clean, null, 2);
  document.getElementById('doc-overlay').classList.add('open');
}

window.closeDocModal = () => {
  document.getElementById('doc-overlay').classList.remove('open');
  currentDoc = null;
};

window.copyDocJson = () => {
  navigator.clipboard.writeText(document.getElementById('doc-json').textContent);
  showToast('JSON copié !', 'success');
};

window.deleteCurrentDoc = async () => {
  if (!currentDoc || !currentColl) return;
  if (!await confirmDialog(
        `Supprimer ce document ? ID : ${currentDoc._id}. Cette action est irréversible.`,
        { title: 'Supprimer le document', confirmLabel: 'Supprimer', danger: true })) return;
  try {
    await deleteDoc(doc(db, currentColl, currentDoc._id));
    showToast('Document supprimé.', 'success');
    closeDocModal();
    selectCollection(currentColl);
  } catch(e) {
    showToast('Erreur : ' + e.message, 'error');
  }
};

// Close modal on backdrop click
document.getElementById('doc-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('doc-overlay')) closeDocModal();
});

init();
</script>
</body>
</html>

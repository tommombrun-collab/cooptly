# Tests à chaque envoi, puis publication de la démo sur GitHub Pages.
# La démo n'est publiée que si les tests passent.
name: Tests et démo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (règles Firestore et logique)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4       # l'émulateur Firestore tourne sur Java
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: tests
      - run: npm test
        working-directory: tests

  demo:
    name: Construction de la démo
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-demo.mjs "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publication
    needs: demo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
